<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETEC DS Quest — Flashcards &amp; Treino Fundação FAT</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --green: #58cc02;
      --green-dark: #46a302;
      --blue: #1cb0f6;
      --blue-dark: #1485bd;
      --red: #ff4b4b;
      --gold: #ffc800;
      --purple: #8b5cf6;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
    header {
      background: var(--surface); border-bottom: 2px solid var(--border);
      position: sticky; top: 0; z-index: 20; padding: 12px 16px;
    }
    .hud { max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font-weight: 800; font-size: 18px; color: var(--green-dark); display: flex; align-items: center; gap: 8px; }
    .stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 700; font-size: 14px; }
    .pill { background: #f8fafc; border: 2px solid var(--border); border-radius: 999px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 5px; }
    .container { max-width: 960px; margin: 18px auto; padding: 0 14px; display: grid; gap: 16px; }
    .progress-wrap { background: #e2e8f0; height: 14px; border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--green); width: 0%; transition: width 0.3s ease; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      flex: 1; min-width: 140px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--border);
      border-bottom-width: 4px; background: var(--surface); font-weight: 700; cursor: pointer; font-size: 14px; color: var(--text);
    }
    .tab-btn.active { background: #e0f2fe; border-color: var(--blue); color: #0369a1; }
    .trail { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 7px 12px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface);
      font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .chip.active { background: var(--green); border-color: var(--green-dark); color: #fff; }
    .panel { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 20px; }

    /* 3D Flashcard */
    .scene { perspective: 1100px; max-width: 620px; margin: 12px auto; }
    .card3d {
      width: 100%; min-height: 250px; position: relative; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer;
    }
    .card3d.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px;
      border: 2px solid var(--border); border-bottom-width: 5px; padding: 24px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      background: #ffffff;
    }
    .face.back { transform: rotateY(180deg); background: #f0fdf4; border-color: #86efac; }
    .tag-badge {
      font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 4px 10px;
      border-radius: 999px; background: #ede9fe; color: #5b21b6; margin-bottom: 12px;
    }
    .card-text { font-size: 19px; font-weight: 700; line-height: 1.45; }
    .face.back .card-text { font-size: 17px; font-weight: 600; color: #14532d; }
    .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn {
      padding: 11px 18px; border-radius: 12px; border: none; border-bottom: 4px solid rgba(0,0,0,0.2);
      font-weight: 800; cursor: pointer; font-size: 14px; color: #fff; background: var(--blue);
    }
    .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-green { background: var(--green); border-bottom-color: var(--green-dark); }
    .btn-gold { background: #f59e0b; border-bottom-color: #b45309; }
    .btn-gray { background: #64748b; border-bottom-color: #475569; }
    .btn-purple { background: var(--purple); border-bottom-color: #6d28d9; }

    /* Quiz & Pairs */
    .options-grid { display: grid; gap: 10px; margin-top: 14px; }
    .opt-btn {
      text-align: left; padding: 13px 16px; border-radius: 12px; border: 2px solid var(--border);
      border-bottom-width: 4px; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text);
    }
    .opt-btn:hover { background: #f8fafc; }
    .opt-btn.correct { background: #dcfce7; border-color: var(--green-dark); color: #14532d; }
    .opt-btn.wrong { background: #fee2e2; border-color: var(--red); color: #7f1d1d; }
    .pairs-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    @media (max-width: 640px) { .pairs-wrap { grid-template-columns: 1fr; } }
    .pair-col { display: grid; gap: 10px; }
    .pair-item {
      padding: 12px; border-radius: 12px; border: 2px solid var(--border); border-bottom-width: 4px;
      background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left;
    }
    .pair-item.selected { border-color: var(--blue); background: #e0f2fe; }
    .pair-item.matched { border-color: var(--green-dark); background: #dcfce7; opacity: 0.65; cursor: default; }
    .pair-item.error { border-color: var(--red); background: #fee2e2; }
    .feedback { margin-top: 12px; padding: 12px; border-radius: 10px; font-weight: 600; display: none; }
    .feedback.show { display: block; }
    .feedback.ok { background: #dcfce7; color: #14532d; }
    .feedback.bad { background: #fee2e2; color: #7f1d1d; }
    .small-muted { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="hud">
      <div class="brand">⚡ ETEC DS Quest <span class="small-muted" style="font-weight:600">(Fundação FAT)</span></div>
      <div class="stats">
        <span class="pill" id="hudHearts">❤️❤️❤️❤️❤️ 5</span>
        <span class="pill" id="hudStreak">🔥 0</span>
        <span class="pill" id="hudXp">⭐ 0 XP</span>
        <button class="chip" id="soundToggle" onclick="toggleSound()">🔊 Som ON</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="panel" style="padding:14px 18px;">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;">
        <span>Domínio do Edital (100 Flashcards)</span>
        <span id="masteryText">0 / 100 dominados</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="masteryBar"></div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('cards', this)">🃏 Flashcards 3D</button>
      <button class="tab-btn" onclick="switchMode('quiz', this)">🎯 Quiz Rápido</button>
      <button class="tab-btn" onclick="switchMode('pairs', this)">🔗 Associação de Pares</button>
      <button class="tab-btn" onclick="switchMode('moldes', this)">🕵️ Treino 4 Moldes FAT</button>
      <button class="tab-btn" onclick="switchMode('apostas', this)">🔮 Apostas Próxima Prova</button>
    </div>

    <div class="trail" id="trailBar"></div>

    <section class="panel" id="stage"></section>
  </main>

  <script>
    const CARDS = [{"front": "Quais são os 4 moldes clássicos de questões da Fundação FAT?", "back": "1) Tabela I, II e III com inversão ou absurdo técnico. 2) Lista com um item intruso. 3) Definição direta no enunciado. 4) Micro-execução (matriz, fatorial, binário, pilha).", "tag": "00_Moldes_FAT"}, {"front": "Como identificar a pegadinha mais comum nas tabelas I, II e III da FAT?", "back": "A banca troca definições entre duas linhas vizinhas (ex: DDL com DQL, SMTP com IMAP) ou insere um absurdo disfarçado (ex: Cookie na nuvem, Notepad como IDE).", "tag": "00_Moldes_FAT"}, {"front": "O que é um Framework e quais os 4 exemplos clássicos da prova?", "back": "Estrutura reutilizável de software para acelerar projetos. Exemplos: Laravel (PHP), React Native (Mobile), Angular (JS) e Bootstrap (UI).", "tag": "01_Programacao"}, {"front": "Quais são os dois \"intrusos\" famosos que a FAT coloca no meio da lista de frameworks?", "back": "Creative Commons (licença de uso) e Adobe Creative Cloud (suíte de design/multimídia).", "tag": "01_Programacao"}, {"front": "O que é Conversão Implícita (Type Coercion)?", "back": "Transformação automática de tipo pelo compilador/interpretador quando os tipos são compatíveis e sem perda de dados (ex: int para float).", "tag": "01_Programacao"}, {"front": "O que é Conversão Explícita (Casting)?", "back": "Conversão forçada manualmente pelo programador usando funções como int(), float() ou str().", "tag": "01_Programacao"}, {"front": "Existe \"Conversão Normal\" na teoria de tipos de dados?", "back": "Não! É um termo inventado pela banca para confundir com conversão implícita e explícita.", "tag": "01_Programacao"}, {"front": "O tipo char armazena valores true ou false?", "back": "Não! char guarda 1 caractere. Quem guarda true/false é o tipo lógico boolean.", "tag": "01_Programacao"}, {"front": "Quais são os principais tipos de dados primitivos?", "back": "int (inteiro), float (ponto flutuante/decimal), char (caractere único), string (texto) e boolean (true/false).", "tag": "01_Programacao"}, {"front": "Qual é o objetivo e a ação central do Teste de Mesa?", "back": "Verificar manualmente um algoritmo sem rodá-lo no PC para achar erros lógicos. A ação central é Executar Linha a Linha anotando cada variável.", "tag": "01_Programacao"}, {"front": "Em matrizes bidimensionais (ex: 3x3), onde começa o índice e qual é a Diagonal Principal?", "back": "Índices começam em [0][0]. Diagonal Principal são os elementos onde linha == coluna: M[0][0] + M[1][1] + M[2][2].", "tag": "01_Programacao"}, {"front": "Pegadinha na matriz: qual a diferença entre Diagonal Principal e Diagonal Secundária em M 3x3?", "back": "Principal: M[0][0]+M[1][1]+M[2][2]. Secundária (pegadinha): M[0][2]+M[1][1]+M[2][0].", "tag": "01_Programacao"}, {"front": "Na Tabela Verdade, quando P AND Q (P ∧ Q) é Verdadeiro?", "back": "Somente quando P e Q forem ambos Verdadeiros (V ∧ V = V). Em todos os outros casos é Falso.", "tag": "01_Programacao"}, {"front": "Na Tabela Verdade, quando P OR Q (P ∨ Q) é Falso?", "back": "Somente quando P e Q forem ambos Falsos (F ∨ F = F). Basta um Verdadeiro para resultar em V.", "tag": "01_Programacao"}, {"front": "O que faz o operador lógico NOT (¬) na Tabela Verdade?", "back": "Inverte o valor lógico da proposição: se for Verdadeiro vira Falso, se for Falso vira Verdadeiro.", "tag": "01_Programacao"}, {"front": "O que fazem os operadores DIV e MOD no Portugol?", "back": "DIV retorna o quociente inteiro da divisão (7 DIV 2 = 3). MOD retorna o resto inteiro da divisão (7 MOD 2 = 1).", "tag": "01_Programacao"}, {"front": "Como funciona a estrutura de dados Pilha (Stack) e suas operações?", "back": "Segue LIFO (Last In, First Out - último a entrar, primeiro a sair). PUSH insere no topo e POP remove do topo.", "tag": "01_Programacao"}, {"front": "Qual a diferença entre Pilha (LIFO) e Fila (FIFO)?", "back": "Na Pilha sai primeiro o último que entrou (LIFO). Na Fila sai primeiro o primeiro que entrou (FIFO).", "tag": "01_Programacao"}, {"front": "O que é Recursividade e quanto vale o fatorial 4!?", "back": "É quando uma função chama a si mesma para resolver subproblemas menores até um caso base. 4! = 4 x 3 x 2 x 1 = 24.", "tag": "01_Programacao"}, {"front": "Qual a diferença entre Editor de Código e Editor WYSIWYG?", "back": "Editor de Código (VS Code, Sublime) tem realce de sintaxe e autocompletar. WYSIWYG (Dreamweaver, Wix) monta páginas visualmente arrastando e soltando.", "tag": "01_Programacao"}, {"front": "Notepad (Windows) e TextEdit (Mac) são IDEs?", "back": "Não! São editores de texto simples sem recursos avançados. IDEs (Eclipse, Visual Studio, NetBeans) integram editor, compilador e depurador.", "tag": "01_Programacao"}, {"front": "Qual a diferença entre ferramentas de Build e ferramentas de Bundling?", "back": "Build automatiza compilação, testes, minificação e pacotes finais. Bundling empacota vários JS/CSS/imagens em menos arquivos para reduzir requisições HTTP.", "tag": "01_Programacao"}, {"front": "Para que servem os comandos branch, diff e merge no controle de versão (Git)?", "back": "branch cria um ramo paralelo na linha de desenvolvimento, diff compara versões e merge funde versões em um caminho único.", "tag": "01_Programacao"}, {"front": "O que é Software com Licença Open Source (Código Aberto)?", "back": "Disponibiliza acesso ao código-fonte permitindo modificar e redistribuir sob condições que promovem colaboração e transparência.", "tag": "01_Programacao"}, {"front": "Software Livre significa obrigatoriamente software gratuito?", "back": "Não! \"Livre\" refere-se à liberdade de executar, estudar, modificar o código-fonte e redistribuir, mesmo que cobrado.", "tag": "01_Programacao"}, {"front": "O que é EULA (End-User License Agreement)?", "back": "Contrato de Licença de Usuário Final que define os termos de uso, restrições e responsabilidades de um software.", "tag": "01_Programacao"}, {"front": "Qual a diferença entre Licença Proprietária e Licenciamento por Assinatura?", "back": "Proprietária fecha o código e proíbe alteração/redistribuição. Assinatura cobra pagamento recorrente (mensal/anual) pelo direito de uso.", "tag": "01_Programacao"}, {"front": "Quais são os 4 Pilares da Programação Orientada a Objetos (POO)?", "back": "Abstração, Encapsulamento, Herança e Polimorfismo. (Pegadinha: Atributos e Métodos são membros da classe, NÃO pilares!).", "tag": "01_Programacao"}, {"front": "Qual a diferença entre Requisito Funcional (RF) e Requisito Não Funcional (RNF)?", "back": "RF diz O QUE o sistema deve fazer (funções/regras). RNF diz COMO ele deve operar e atributos de qualidade (desempenho, segurança, portabilidade).", "tag": "01_Programacao"}, {"front": "O que é o Requisito Não Funcional de Portabilidade?", "back": "Facilidade com que o software pode ser transferido de um ambiente ou sistema computacional para outro e permanecer executável.", "tag": "01_Programacao"}, {"front": "Quais são as 5 características de bons requisitos de software?", "back": "Clareza, Testabilidade, Consistência, Rastreabilidade e Viabilidade. (Intrusos da prova: Ambiguidade, Inconsistência, Irrelevância).", "tag": "01_Programacao"}, {"front": "Qual é a pegadinha clássica sobre Estudo de Viabilidade Legal vs Operacional?", "back": "A banca chama de Viabilidade Legal o texto que fala de infraestrutura humana e capacidade operacional. Viabilidade Legal trata de leis e normas.", "tag": "01_Programacao"}, {"front": "Qual a ordem exata das etapas do Modelo em Cascata (Waterfall)?", "back": "Requerimento -> Projeto -> Construção -> Teste/Depuração -> Instalação -> Manutenção.", "tag": "01_Programacao"}, {"front": "No Scrum, o que são Sprint, Product Backlog e Daily Scrum?", "back": "Sprint é o ciclo/iteração (time-box). Product Backlog é a lista priorizada de funcionalidades. Daily Scrum é a reunião diária curta.", "tag": "01_Programacao"}, {"front": "O que é Programação em Par (Pair Programming) no XP?", "back": "Prática em que dois programadores trabalham juntos no mesmo código alternando papéis, melhorando revisão, detecção de falhas e manutenção.", "tag": "01_Programacao"}, {"front": "O que verifica o Teste de Unidade?", "back": "Testa a menor unidade isolada de código-fonte (método, função ou classe) para garantir que atende à especificação.", "tag": "01_Programacao"}, {"front": "Na UML, para que serve o Diagrama de Casos de Uso?", "back": "Mostra as interações entre usuários (atores) e o sistema, identificando os requisitos funcionais.", "tag": "01_Programacao"}, {"front": "O que analisa a matriz SWOT?", "back": "Ambiente interno (Forças e Fraquezas) e ambiente externo (Oportunidades e Ameaças).", "tag": "01_Programacao"}, {"front": "Quais comandos pertencem à sublinguagem DDL (Data Definition Language)?", "back": "CREATE, ALTER e DROP (definem ou alteram a estrutura das tabelas e do banco).", "tag": "02_Banco_Dados"}, {"front": "Quais comandos pertencem à sublinguagem DML (Data Manipulation Language)?", "back": "INSERT, UPDATE e DELETE (inserem, atualizam e excluem registros/dados).", "tag": "02_Banco_Dados"}, {"front": "Qual comando pertence à sublinguagem DQL (Data Query Language)?", "back": "SELECT (consulta e recupera dados armazenados nas tabelas).", "tag": "02_Banco_Dados"}, {"front": "Pegadinha nº 1 de Banco de Dados na FAT: o que a banca troca na tabela de SQL?", "back": "Ela inverte DDL com DQL, dizendo que DQL usa CREATE/ALTER/DROP e DDL usa SELECT. Falso!", "tag": "02_Banco_Dados"}, {"front": "Quais comandos pertencem a DCL e TCL (DTL) em SQL?", "back": "DCL (Controle): GRANT e REVOKE. TCL (Transação): COMMIT e ROLLBACK.", "tag": "02_Banco_Dados"}, {"front": "No Modelo Relacional, o que são Tuplas e Atributos?", "back": "Em uma tabela, linhas são chamadas de Tuplas (registros) e colunas são chamadas de Atributos (campos).", "tag": "02_Banco_Dados"}, {"front": "Qual a diferença entre Chave Primária (PK) e Chave Estrangeira (FK)?", "back": "PK identifica unicamente cada linha da própria tabela. FK é uma coluna que referencia a PK de outra tabela para ligá-las.", "tag": "02_Banco_Dados"}, {"front": "O que é Chave Alternativa em Banco de Dados?", "back": "Quando existem várias chaves candidatas, uma é escolhida como Chave Primária e as candidatas restantes são chamadas de Chaves Alternativas.", "tag": "02_Banco_Dados"}, {"front": "Quais são os tipos de cardinalidade e o que é Relacionamento Recursivo?", "back": "Cardinalidades: 1:1, 1:N e N:N. Recursivo (auto-relacionamento) é quando uma entidade se relaciona consigo mesma (pode ser 1:N, N:1 ou N:N).", "tag": "02_Banco_Dados"}, {"front": "O que exige a Primeira Forma Normal (1FN / 1NF)?", "back": "Todos os atributos devem ter apenas valores atômicos (indivisíveis), sem colunas repetidas ou múltiplos valores na mesma célula (ex: dois telefones juntos).", "tag": "02_Banco_Dados"}, {"front": "O que exigem a 2ª Forma Normal (2FN) e a 3ª Forma Normal (3FN)?", "back": "2FN: estar na 1FN e não ter dependência parcial da chave composta. 3FN: estar na 2FN e eliminar dependências transitivas entre atributos não-chave.", "tag": "02_Banco_Dados"}, {"front": "Qual a sintaxe SQL correta para contar clientes de São Paulo?", "back": "SELECT COUNT(*) FROM clientes WHERE cidade = 'São Paulo'.", "tag": "02_Banco_Dados"}, {"front": "Por que \"SELECT * FROM clientes WHERE COUNT(cidade) = 'São Paulo'\" está errada?", "back": "Porque funções de agregação como COUNT(*) ficam logo após o SELECT, nunca dentro da cláusula WHERE.", "tag": "02_Banco_Dados"}, {"front": "Para que serve a cláusula WHERE na DQL?", "back": "Realiza Filtragem e Condições, restringindo as linhas retornadas por um SELECT.", "tag": "02_Banco_Dados"}, {"front": "O que é um Dicionário de Dados?", "back": "Coleção de nomes, atributos e definições sobre os elementos de dados usados no projeto do sistema.", "tag": "02_Banco_Dados"}, {"front": "Quais os exemplos clássicos de bancos Não Relacionais (NoSQL) vs Relacionais (SQL)?", "back": "NoSQL: MongoDB e Cassandra. Relacionais (SQL): MySQL, PostgreSQL, Oracle e SQL Server.", "tag": "02_Banco_Dados"}, {"front": "Quais são os 3 padrões de cores cobrados pela Fundação FAT?", "back": "CMYK (impressão/pigmento), RGB (luz/telas) e Hexadecimal (#RRGGBB na web). (Pegadinha: \"Primária\" e \"CSS\" não são padrões!).", "tag": "03_Design_Digital"}, {"front": "Quando usar RGB vs CMYK?", "back": "RGB (Red, Green, Blue) para telas e dispositivos digitais (síntese aditiva). CMYK (Cyan, Magenta, Yellow, Black) para impressão gráfica (síntese subtrativa).", "tag": "03_Design_Digital"}, {"front": "O que é o Círculo Cromático e quais as harmonias de 3 cores?", "back": "Representação circular de 12 cores (3 primárias, 3 secundárias, 6 terciárias). Harmonias de 3 cores: Análogas, Triangulação e Meio-complementares.", "tag": "03_Design_Digital"}, {"front": "Quais são os formatos de imagem Vetorial que nunca perdem qualidade ao ampliar?", "back": "SVG (Scalable Vector Graphics) e PDF (além de AI e CDR), pois são definidos por fórmulas matemáticas.", "tag": "03_Design_Digital"}, {"front": "Quais são os formatos de imagem Bitmap/Raster que perdem qualidade ao ampliar?", "back": "JPEG/JPG, PNG, BMP e GIF, pois são compostos por grade fixa de pixels.", "tag": "03_Design_Digital"}, {"front": "Qual a diferença prática entre PNG e JPEG?", "back": "PNG não perde qualidade na compressão e suporta transparência (canal alfa). JPEG usa compressão com perdas e não tem transparência.", "tag": "03_Design_Digital"}, {"front": "O que é Rasterização?", "back": "Processo de converter gráficos vetoriais (fórmulas matemáticas) em imagens compostas por pixels para exibição em dispositivos digitais.", "tag": "03_Design_Digital"}, {"front": "Quais as 3 características principais dos Bancos de Imagens segundo a FAT?", "back": "Variedade de Conteúdo, Licenciamento (gratuitas/pagas, uso comercial/pessoal) e Qualidade/Resolução (para impressão ou uso digital).", "tag": "03_Design_Digital"}, {"front": "Na Gestalt, o que define o princípio da Continuidade?", "back": "Linhas e padrões que seguem uma trajetória contínua são percebidos como pertencentes a um mesmo elemento.", "tag": "03_Design_Digital"}, {"front": "Na Gestalt, diferencie Proximidade, Semelhança, Fechamento e Figura-Fundo.", "back": "Proximidade: itens perto formam grupo. Semelhança: cor/forma parecida agrupa. Fechamento: mente completa formas abertas. Figura-Fundo: separa objeto do plano atrás.", "tag": "03_Design_Digital"}, {"front": "Na Tipografia, o que caracteriza as Fontes Script?", "back": "Reproduzem a escrita humana com aparência tradicional/elegante, muito usadas em convites formais.", "tag": "03_Design_Digital"}, {"front": "Quais exemplos de serviços de Fontes Personalizadas para Web vs fontes de sistema?", "back": "Personalizadas: Google Fonts e Adobe Fonts. Padrão de sistema (pegadinha): Times New Roman, Arial e Helvetica.", "tag": "03_Design_Digital"}, {"front": "O que diz a Heurística de Nielsen \"Equivalência entre o sistema e o mundo real\"?", "back": "Toda comunicação do sistema deve falar a linguagem e seguir o modelo mental do usuário, evitando jargões técnicos internos.", "tag": "03_Design_Digital"}, {"front": "No HTML, o que são Tags e Atributos?", "back": "Tags definem a estrutura e o tipo de conteúdo (ex: <a>, <p>). Atributos são propriedades extras adicionadas às tags (ex: href, target).", "tag": "04_Web_Redes_SO"}, {"front": "Na tag <a> do HTML, qual valor de target abre o link em uma nova aba ou janela?", "back": "target=\"_blank\". (_self abre na mesma aba, _parent no frame pai, _top na janela toda, _none não existe).", "tag": "04_Web_Redes_SO"}, {"front": "Quais são as principais tags estruturais semânticas do HTML5?", "back": "Semânticas: <nav>, <header>, <footer> e <section>. (Pegadinha: <div> e <span> NÃO são semânticas!).", "tag": "04_Web_Redes_SO"}, {"front": "O que significam <ol> e <ul>, e qual a diferença entre <div> e <span>?", "back": "ol = ordered list (ordenada), ul = unordered list (não ordenada). <div> é elemento de bloco, <span> é inline.", "tag": "04_Web_Redes_SO"}, {"front": "Quais são as duas partes principais de uma regra CSS?", "back": "Seletor (elemento/classe/id alvo) e Bloco de Declarações (chaves { propriedade: valor }).", "tag": "04_Web_Redes_SO"}, {"front": "O que fazem as transformações CSS3 scale, skew, translate e rotate?", "back": "scale: aumenta/diminui proporcionalmente. skew: inclina ângulos. translate: move nos eixos X e Y. rotate: gira pelo ângulo.", "tag": "04_Web_Redes_SO"}, {"front": "Para que servem as classes Bootstrap btn-default, form-inline, col-md-1, img-responsive e text-primary?", "back": "Respectivamente: botão, formulário, grid (coluna), imagem responsiva e texto de ajuda/destaque.", "tag": "04_Web_Redes_SO"}, {"front": "No JavaScript (DOM), o que fazem getElementById, createTextNode, documentElement e parentNode?", "back": "Buscam elemento por id, criam nó de texto, capturam a raiz <html> e retornam o nó pai, respectivamente.", "tag": "04_Web_Redes_SO"}, {"front": "Onde os Cookies são armazenados: no navegador do usuário ou na nuvem?", "back": "Sempre LOCALMENTE no navegador do usuário! Dizer que ficam \"na nuvem\" é pegadinha clássica da FAT.", "tag": "04_Web_Redes_SO"}, {"front": "Qual o limite aproximado de tamanho de um Cookie e quais seus tipos de duração?", "back": "Cerca de 4 KB por cookie. Duração: Sessão (apagado ao fechar o navegador) ou Permanente (até expirar ou ser removido).", "tag": "04_Web_Redes_SO"}, {"front": "Diferencie Hospedagem Compartilhada, Dedicada e VPS.", "back": "Compartilhada: vários sites dividem CPU/RAM de 1 servidor. Dedicada: 1 servidor inteiro só para 1 site. VPS: 1 servidor particionado em máquinas virtuais com recursos dedicados.", "tag": "04_Web_Redes_SO"}, {"front": "Qual é a principal característica dos Contêineres em relação às Máquinas Virtuais (VMs)?", "back": "Isolamento leve: cada contêiner empacota a app e dependências sem precisar virtualizar todo o hardware completo como uma VM.", "tag": "04_Web_Redes_SO"}, {"front": "Quantos bits há em 1 byte e como se representa 255 em binário?", "back": "1 byte = 8 bits (256 combinações de 0 a 255). O número 255 em binário é 11111111.", "tag": "04_Web_Redes_SO"}, {"front": "Converta 10, 100 e 250 da base decimal para binário (e 100/250 para hexadecimal).", "back": "10 = 1010(2). 100 = 01100100(2) = 64(16). 250 = 11111010(2) = FA(16).", "tag": "04_Web_Redes_SO"}, {"front": "Quais as características do SSD que o diferenciam do HD?", "back": "Usa chips de memória flash (como pendrive), não possui partes mecânicas, tem acesso rápido, menos vibração e menor consumo de bateria.", "tag": "04_Web_Redes_SO"}, {"front": "Qual função do Sistema Operacional gerencia a memória RAM?", "back": "Gerenciamento de Memória: aloca e libera espaço na RAM para programas em execução, otimizando o desempenho.", "tag": "04_Web_Redes_SO"}, {"front": "Quais são os 7 diretórios padrão do Linux cobrados na prova (e qual é a pegadinha)?", "back": "Diretórios reais: /bin, /etc, /home, /lib, /usr, /var e /tmp. Pegadinha: colocar comandos como /ls, /cd, /mkdir, /pwd ou /rm como se fossem pastas!", "tag": "04_Web_Redes_SO"}, {"front": "Para que servem os comandos Linux ls, mkdir, cp, apt, cat e shutdown?", "back": "ls: listar pasta. mkdir: criar pasta. cp: copiar. apt: gerenciar pacotes. cat: ler arquivo texto. shutdown: desligar/reiniciar.", "tag": "04_Web_Redes_SO"}, {"front": "Quais são as 4 camadas do modelo TCP/IP?", "back": "Link (Acesso à Rede), Internet, Transporte e Aplicação. (Pegadinha: \"Sessão\" e \"Física\" pertencem ao modelo OSI).", "tag": "04_Web_Redes_SO"}, {"front": "Qual é a função do protocolo fundamental TCP/IP?", "back": "Dividir os dados em pacotes, endereçá-los/roteá-los até o destino e reagrupá-los na chegada.", "tag": "04_Web_Redes_SO"}, {"front": "O que fazem os protocolos HTTP/HTTPS, FTP, DNS e RDP?", "back": "HTTP/S: páginas web. FTP: arquivos. DNS: traduz nomes de domínio em IP. RDP: acesso remoto gráfico Microsoft.", "tag": "04_Web_Redes_SO"}, {"front": "Quais as 3 funcionalidades principais do SSL/TLS?", "back": "Criptografia, Autenticação e Integridade dos Dados.", "tag": "04_Web_Redes_SO"}, {"front": "Diferencie SMTP, POP3 e IMAP (campeão de inversões da FAT!).", "back": "SMTP: ENVIO de e-mails. POP3: BAIXA para o dispositivo e geralmente apaga do servidor. IMAP: sincroniza e gerencia direto no servidor entre vários dispositivos.", "tag": "04_Web_Redes_SO"}, {"front": "Qual a diferença entre Topologia em Barramento (Bus) e Topologia em Estrela (Star)?", "back": "Barramento: cabo único central (se o cabo falhar, toda a rede cai). Estrela: ligada a unidade central inteligente (switch) que distribui o tráfego.", "tag": "04_Web_Redes_SO"}, {"front": "Quais os 3 setores clássicos de aplicação da IoT (Internet das Coisas) na prova?", "back": "Residências inteligentes (câmeras/termostatos), Cidades inteligentes (tráfego/iluminação/poluição) e Indústria/Saúde (manutenção preditiva/monitoramento).", "tag": "04_Web_Redes_SO"}, {"front": "Quais os 5 navegadores web da lista oficial da prova (e os intrusos)?", "back": "Navegadores: Chrome, Firefox, Edge, Safari e Opera. Intrusos: Telegram, Messenger, Capcut, Youtube e Truecaller.", "tag": "04_Web_Redes_SO"}, {"front": "Quais os exemplos válidos de Webmail e suas características?", "back": "Gmail, Outlook.com e iCloud Mail (acesso pelo navegador com armazenamento na nuvem). Intrusos: Canva, Splice, Norton Safe Web.", "tag": "04_Web_Redes_SO"}, {"front": "Quais as 3 características das Suítes de Produtividade (Office 365) e recursos do Word/Windows?", "back": "Integração de apps, Colaboração em tempo real e Acessibilidade na nuvem. Word: Marcadores/Numeração, Controlar Alterações. Windows: Ctrl+C copia, Ctrl+X recorta.", "tag": "04_Web_Redes_SO"}, {"front": "No inglês técnico da FAT, o que significam outcomes, data e soft skills?", "back": "outcomes = resultados (não \"saídas\"). data = dados (NUNCA \"datas\"!). soft skills = habilidades comportamentais (não \"cuidados suaves\").", "tag": "05_Ingles_Etica"}, {"front": "No inglês técnico da FAT, o que significam troubleshooting, inference, gathering e predict?", "back": "troubleshooting = solução de problemas. inference = dedução/conclusão. gathering = coleta. predict = prever/antecipar.", "tag": "05_Ingles_Etica"}, {"front": "Como acertar sempre a questão de Ética sobre \"Bem Comum\"?", "back": "Escolha a atitude solidária genuína voltada à coletividade. Elimine opções com interesse próprio (\"liberar espaço\", \"ganhar promoção\", \"postar em redes sociais\").", "tag": "05_Ingles_Etica"}, {"front": "Como acertar a questão de Ética sobre \"Relações Trabalhistas e Consumo\"?", "back": "Escolha respeito aos direitos trabalhistas, qualidade de vida dos colaboradores e consumo consciente/sustentável. Elimine corte de direitos ou propaganda enganosa.", "tag": "05_Ingles_Etica"}, {"front": "Como acertar a questão de Ética sobre \"Direito Constitucional e Meio Ambiente\"?", "back": "Escolha políticas públicas com participação das comunidades locais, estudo de impacto e preservação ambiental sustentável.", "tag": "05_Ingles_Etica"}];

    const STORE_KEY = "etec_ds_quest_v1";
    let state = loadState();

    let activeTag = "ALL";
    let cardIdx = 0;
    let isFlipped = false;

    let audioCtx = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { xp: 0, streak: 0, hearts: 5, known: [], review: [] };
    }

    function saveState() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
      renderHud();
    }

    function playTone(freq, duration, type = "sine", delay = 0) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + delay;
        gain.gain.setValueAtTime(0.12, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration);
      } catch (e) {}
    }

    function sfxOk() { playTone(523.25, 0.12, "triangle", 0); playTone(659.25, 0.18, "triangle", 0.09); }
    function sfxBad() { playTone(200, 0.16, "sawtooth", 0); playTone(150, 0.22, "sawtooth", 0.12); }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById("soundToggle").textContent = soundOn ? "🔊 Som ON" : "🔇 Som OFF";
    }

    function renderHud() {
      const hearts = Math.max(0, state.hearts);
      document.getElementById("hudHearts").textContent = "❤️".repeat(hearts) + "🤍".repeat(5 - hearts) + " " + hearts;
      document.getElementById("hudStreak").textContent = "🔥 " + state.streak;
      document.getElementById("hudXp").textContent = "⭐ " + state.xp + " XP";
      const pct = Math.round((state.known.length / CARDS.length) * 100);
      document.getElementById("masteryText").textContent = `${state.known.length} / ${CARDS.length} dominados (${pct}%)`;
      document.getElementById("masteryBar").style.width = pct + "%";
    }

    function renderTrail() {
      const bar = document.getElementById("trailBar");
      bar.innerHTML = "";
      Object.entries(MODULE_NAMES).forEach(([key, label]) => {
        const b = document.createElement("button");
        b.className = "chip" + (activeTag === key ? " active" : "");
        const count = key === "REVIEW" ? ` (${state.review.length})` : "";
        b.textContent = label + count;
        b.onclick = () => {
          activeTag = key;
          cardIdx = 0;
          isFlipped = false;
          renderTrail();
          renderStage();
        };
        bar.appendChild(b);
      });
    }

    function getFilteredCards() {
      if (activeTag === "ALL") return CARDS.map((c, idx) => ({ ...c, idx }));
      if (activeTag === "REVIEW") {
        return CARDS.map((c, idx) => ({ ...c, idx })).filter((c) => state.review.includes(c.idx));
      }
      return CARDS.map((c, idx) => ({ ...c, idx })).filter((c) => c.tag === activeTag);
    }

    function switchMode(mode, btn) {
      activeMode = mode;
      document.querySelectorAll(".tab-btn").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      renderStage();
    }

    function renderStage() {
      if (activeMode === "cards") renderCardsMode();
      else if (activeMode === "quiz") renderQuizMode();
      else if (activeMode === "pairs") renderPairsMode();
      else if (activeMode === "moldes") renderMoldesMode();
      else renderApostasMode();

    function renderCardsMode() {

        return;
      }
      if (cardIdx >= list.length) cardIdx = 0;
      const item = list[cardIdx];
      const tagLabel = MODULE_NAMES[item.tag] || item.tag;
      const isKnown = state.known.includes(item.idx);

      stage.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="small-muted">Card ${cardIdx + 1} de ${list.length} ${isKnown ? "• ✅ Dominado" : ""}</span>

        <div class="scene">

            <div class="face front">
              <span class="tag-badge">${tagLabel}</span>

            </div>
            <div class="face back">
              <span class="tag-badge" style="background:#dcfce7; color:#166534;">Resposta Oficial</span>
              <div class="card-text">${escapeHtml(item.back)}</div>
            </div>
          </div>
        </div>
        <div class="controls">
          <button class="btn btn-gray" onclick="prevCard()">◀ Anterior</button>
          <button class="btn btn-gold" onclick="markReview(${item.idx})">🔁 Revisar depois</button>
          <button class="btn btn-green" onclick="markKnown(${item.idx})">✅ Já sei (+10 XP)</button>
          <button class="btn btn-gray" onclick="nextCard()">Próximo ▶</button>
        </div>
      `;
    }

    function flipCard() { isFlipped = !isFlipped; renderCardsMode(); }
    function nextCard() { const l = getFilteredCards(); cardIdx = (cardIdx + 1) % Math.max(1, l.length); isFlipped = false; renderCardsMode(); }
    function prevCard() { const l = getFilteredCards(); cardIdx = (cardIdx - 1 + l.length) % Math.max(1, l.length); isFlipped = false; renderCardsMode(); }

    function markKnown(idx) {
      if (!state.known.includes(idx)) state.known.push(idx);
      state.review = state.review.filter((i) => i !== idx);
      state.xp += 10;
      state.streak += 1;
      sfxOk();
      saveState();
      renderTrail();
      nextCard();
    }

    function markReview(idx) {
      if (!state.review.includes(idx)) state.review.push(idx);
      state.known = state.known.filter((i) => i !== idx);
      saveState();
      renderTrail();
      nextCard();
    }

    // Quiz Mode
    let currentQuiz = null;
    function renderQuizMode() {
      const stage = document.getElementById("stage");
      if (state.hearts <= 0) {
        stage.innerHTML = `<div style="text-align:center; padding:24px;"><h3>💔 Vidas esgotadas!</h3><p>Revise alguns Flashcards ou recarregue suas 5 vidas para continuar.</p><button class="btn btn-green" onclick="refillHearts()">❤️ Recuperar 5 Vidas</button></div>`;
        return;
      }
      const pool = getFilteredCards();
      const basePool = pool.length >= 4 ? pool : CARDS.map((c, idx) => ({ ...c, idx }));
      const target = basePool[Math.floor(Math.random() * basePool.length)];
      const distractors = CARDS.filter((c) => c.front !== target.front)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      const options = [target, ...distractors].sort(() => Math.random() - 0.5);
      currentQuiz = { target, options, answered: false };

      stage.innerHTML = `
        <div class="tag-badge">${MODULE_NAMES[target.tag] || target.tag}</div>
        <h3 style="margin:4px 0 10px 0;">${escapeHtml(target.front)}</h3>
        <div class="options-grid" id="quizOpts"></div>
        <div class="feedback" id="quizFeedback"></div>
        <div class="controls" style="justify-content:flex-end;">
          <button class="btn" onclick="renderQuizMode()">Próximo Desafio ▶</button>
        </div>
      `;
      const grid = document.getElementById("quizOpts");
      options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = opt.back;
        b.onclick = () => answerQuiz(b, opt.front === target.front, target.back);
        grid.appendChild(b);
      });
    }

    function answerQuiz(btn, isCorrect, rightText) {
      if (currentQuiz.answered) return;
      currentQuiz.answered = true;
      const fb = document.getElementById("quizFeedback");
      if (isCorrect) {
        btn.classList.add("correct");
        state.xp += 15;
        state.streak += 1;
        sfxOk();
        fb.className = "feedback show ok";
        fb.textContent = "✅ Perfeito! +15 XP";
      } else {
        btn.classList.add("wrong");
        state.hearts = Math.max(0, state.hearts - 1);
        state.streak = 0;
        sfxBad();
        fb.className = "feedback show bad";
        fb.textContent = "❌ Ops! Resposta correta: " + rightText;
      }
      saveState();
    }

    function refillHearts() {
      state.hearts = 5;
      saveState();
      renderStage();
    }

    // Pairs Mode
    let pairState = { leftSel: null, rightSel: null, items: [], matchedCount: 0 };
    function renderPairsMode() {
      const stage = document.getElementById("stage");
      const chosen = [...PAIRS_BANK].sort(() => Math.random() - 0.5).slice(0, 6);
      const leftList = [...chosen].sort(() => Math.random() - 0.5);
      const rightList = [...chosen].sort(() => Math.random() - 0.5);
      pairState = { leftSel: null, rightSel: null, matchedCount: 0, total: chosen.length };

      stage.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div><strong>🔗 Associação de Pares:</strong> clique no termo à esquerda e depois na definição correspondente à direita.</div>
          <button class="btn btn-purple" onclick="renderPairsMode()">🔄 Nova Rodada</button>
        </div>
        <div class="pairs-wrap">
          <div class="pair-col" id="pairLeft"></div>
          <div class="pair-col" id="pairRight"></div>
        </div>
        <div class="feedback" id="pairFeedback"></div>
      `;

      const lCol = document.getElementById("pairLeft");
      const rCol = document.getElementById("pairRight");

      leftList.forEach((p) => {
        const b = document.createElement("button");
        b.className = "pair-item";
        b.textContent = p.term;
        b.dataset.term = p.term;
        b.onclick = () => selectPair("left", b);
        lCol.appendChild(b);
      });

      rightList.forEach((p) => {
        const b = document.createElement("button");
        b.className = "pair-item";
        b.textContent = p.def;
        b.dataset.term = p.term;
        b.onclick = () => selectPair("right", b);
        rCol.appendChild(b);
      });
    }

    function selectPair(side, el) {
      if (el.classList.contains("matched")) return;
      if (side === "left") {
        document.querySelectorAll("#pairLeft .pair-item").forEach((x) => x.classList.remove("selected"));
        pairState.leftSel = el;
      } else {
        document.querySelectorAll("#pairRight .pair-item").forEach((x) => x.classList.remove("selected"));
        pairState.rightSel = el;
      }
      el.classList.add("selected");

      if (pairState.leftSel && pairState.rightSel) {
        const l = pairState.leftSel;
        const r = pairState.rightSel;
        pairState.leftSel = null;
        pairState.rightSel = null;
        const fb = document.getElementById("pairFeedback");

        if (l.dataset.term === r.dataset.term) {
          l.classList.remove("selected");
          r.classList.remove("selected");
          l.classList.add("matched");
          r.classList.add("matched");
          pairState.matchedCount += 1;
          state.xp += 10;
          state.streak += 1;
          sfxOk();
          if (pairState.matchedCount === pairState.total) {
            state.xp += 20;
            fb.className = "feedback show ok";
            fb.textContent = "🎉 Rodada completa! Bônus +20 XP!";
          }
          saveState();
        } else {
          l.classList.add("error");
          r.classList.add("error");
          state.streak = 0;
          sfxBad();
          saveState();
          setTimeout(() => {
            l.classList.remove("selected", "error");
            r.classList.remove("selected", "error");
          }, 450);
        }
      }
    }

    // Moldes FAT Mode
    let moldeIdx = 0;
    let moldeAnswered = false;
    function renderMoldesMode() {
      const stage = document.getElementById("stage");
      const q = MOLDES_CHALLENGES[moldeIdx % MOLDES_CHALLENGES.length];
      moldeAnswered = false;

      stage.innerHTML = `
        <div class="tag-badge">${escapeHtml(q.molde)}</div>
        <h3 style="margin:6px 0 12px 0;">${escapeHtml(q.question)}</h3>
        <div class="options-grid" id="moldeOpts"></div>
        <div class="feedback" id="moldeFeedback"></div>
        <div class="controls" style="justify-content:flex-end;">
          <button class="btn btn-purple" onclick="nextMolde()">Próxima Pegadinha ▶</button>
        </div>
      `;
      const grid = document.getElementById("moldeOpts");
      q.options.forEach((txt, idx) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = txt;
        b.onclick = () => {
          if (moldeAnswered) return;
          moldeAnswered = true;
          const fb = document.getElementById("moldeFeedback");
          if (idx === q.correct) {
            b.classList.add("correct");
            state.xp += 20;
            state.streak += 1;
            sfxOk();
            fb.className = "feedback show ok";
            fb.textContent = "✅ Na mosca! (+20 XP) — " + q.explain;
          } else {
            b.classList.add("wrong");
            grid.children[q.correct].classList.add("correct");
            state.streak = 0;
            state.hearts = Math.max(0, state.hearts - 1);
            sfxBad();
            fb.className = "feedback show bad";
            fb.textContent = "❌ Caiu na pegadinha! " + q.explain;
          }
          saveState();
        };
        grid.appendChild(b);
      });
    }

    function nextMolde() {
      moldeIdx = (moldeIdx + 1) % MOLDES_CHALLENGES.length;
      renderMoldesMode();
    }

    const APOSTAS_QUESTIONS = [
      {
        tag: "Aposta 1 • Fluxograma (Tabela I, II, III)",
        q: "Analise: I. Oval/Terminal marca Início e Fim. | II. Retângulo indica decisão condicional (Sim/Não). | III. Losango indica processamento/cálculo. Quais estão corretas?",
        opts: ["Apenas I está correta", "Apenas II e III estão corretas", "Apenas I e II estão corretas", "Todas (I, II e III)"],
        ans: 0,
        exp: "Pegadinha de inversão! Retângulo é processamento/cálculo e Losango é decisão condicional. Só I está correta."
      },
      {
        tag: "Aposta 2 • Laços de Repetição",
        q: "Qual estrutura de repetição testa a condição apenas NO FINAL do bloco, garantindo que ele execute pelo menos 1 vez?",
        opts: ["while (Enquanto)", "for (Para)", "do-while (Faça-Enquanto)", "if / else"],
        ans: 2,
        exp: "O while testa no início (pode rodar 0 vezes). O do-while / repita-até testa no final e executa no mínimo 1 vez."
      },
      {
        tag: "Aposta 3 • Teste de Mesa + Vetor",
        q: "Dado V = [2, 5, 8, 3, 6], um laço soma apenas os elementos onde (V[i] MOD 2) == 0. Qual a soma final?",
        opts: ["8", "14", "16", "24"],
        ans: 2,
        exp: "Os pares (MOD 2 == 0) são 2, 8 e 6. Logo: 2 + 8 + 6 = 16."
      },
      {
        tag: "Aposta 4 • Pilares da POO (Lista com Intruso)",
        q: "Quais são EXCLUSIVAMENTE os 4 pilares da Programação Orientada a Objetos (POO)?",
        opts: [
          "Abstração, Atributos, Herança e Polimorfismo",
          "Abstração, Encapsulamento, Herança e Polimorfismo",
          "Encapsulamento, Métodos, Atributos e Herança",
          "Abstração, Normalização, Encapsulamento e Herança"
        ],
        ans: 1,
        exp: "Atributos e Métodos são membros da classe, não pilares! Os 4 pilares são Abstração, Encapsulamento, Herança e Polimorfismo."
      },
      {
        tag: "Aposta 5 • Papéis do Scrum (Inversão)",
        q: "Analise: I. Product Owner remove impedimentos técnicos do time. | II. Scrum Master prioriza o Product Backlog de negócio. | III. Daily Scrum é a reunião diária curta. Quais estão corretas?",
        opts: ["Apenas I e II", "Apenas III está correta", "Apenas I e III", "Todas (I, II e III)"],
        ans: 1,
        exp: "Inversão clássica! O PO prioriza o Product Backlog e o Scrum Master remove impedimentos."
      },
      {
        tag: "Aposta 6 • Modelagem de Dados (Inversão)",
        q: "Analise: I. Modelo Conceitual depende do SGBD MySQL e cria tabelas SQL. | II. Modelo Lógico define tabelas, PK e FK. | III. Modelo Físico é feito apenas em DER abstrato. Quais estão corretas?",
        opts: ["Apenas I está correta", "Apenas II está correta", "Apenas I e III estão corretas", "Todas estão corretas"],
        ans: 1,
        exp: "Conceitual (DER, independente de SGBD) e Físico (SQL específico do SGBD) foram invertidos! Só II está correta."
      },
      {
        tag: "Aposta 7 • Atributos no DER",
        q: "Na entidade Funcionario, o campo 'idade' calculado automaticamente a partir da 'data_nascimento' é um atributo:",
        opts: ["Simples (Atômico)", "Composto", "Multivalorado", "Derivado"],
        ans: 3,
        exp: "Atributo Derivado é obtido/calculado a partir de outro atributo armazenado (ex: idade via data_nascimento)."
      },
      {
        tag: "Aposta 8 • SQL DCL e TCL",
        q: "Respectivamente, quais comandos pertencem a DDL, DML, DQL, DCL e TCL?",
        opts: [
          "CREATE, INSERT, SELECT, GRANT, COMMIT",
          "SELECT, CREATE, INSERT, COMMIT, GRANT",
          "CREATE, SELECT, INSERT, REVOKE, ROLLBACK",
          "ALTER, DROP, UPDATE, GRANT, SELECT"
        ],
        ans: 0,
        exp: "DDL=CREATE, DML=INSERT, DQL=SELECT, DCL=GRANT/REVOKE, TCL=COMMIT/ROLLBACK."
      },
      {
        tag: "Aposta 9 • CSS Box Model",
        q: "No Box Model do CSS3, qual propriedade controla o espaçamento INTERNO (entre o conteúdo e a borda) e qual controla o EXTERNO?",
        opts: ["margin e padding", "padding e margin", "border e outline", "scale e translate"],
        ans: 1,
        exp: "Padding = Por dentro (entre conteúdo e borda); Margin = Margem de fora (externa)."
      },
      {
        tag: "Aposta 10 • Tabelas HTML e Formulários",
        q: "Analise: I. <tr> representa uma célula individual de dado. | II. GET envia dados visíveis na URL. | III. POST envia dados no corpo da requisição. Quais estão corretas?",
        opts: ["Apenas I", "Apenas II e III", "Apenas I e III", "Todas"],
        ans: 1,
        exp: "<tr> é Table Row (linha); a célula de dado é <td> (Table Data). GET e POST estão corretos."
      },
      {
        tag: "Aposta 11 • Computação em Nuvem",
        q: "Qual modelo de nuvem entrega um aplicativo pronto ao usuário final direto no navegador (como Gmail e Office 365)?",
        opts: ["IaaS (Infraestrutura como Serviço)", "PaaS (Plataforma como Serviço)", "SaaS (Software como Serviço)", "VPS (Servidor Privado Virtual)"],
        ans: 2,
        exp: "SaaS = Software pronto para o usuário final; PaaS = ambiente para devs; IaaS = máquinas/redes virtuais."
      },
      {
        tag: "Aposta 12 • Memória Volátil vs Não-Volátil",
        q: "Qual afirmação está correta sobre armazenamento e binário?",
        opts: [
          "RAM é não-volátil e 255 em binário vale 10000001",
          "SSD usa memória flash não-volátil sem partes mecânicas; RAM é volátil; 255 = 11111111",
          "HD usa memória flash sem partes mecânicas e 1 byte tem 4 bits",
          "Cache L1 é mais lenta que o HD magnético"
        ],
        ans: 1,
        exp: "SSD = flash não-volátil sem peças móveis; RAM = volátil (apaga sem energia); 1 byte = 8 bits -> 255 = 11111111."
      },
      {
        tag: "Aposta 13 • Gestalt (Proximidade)",
        q: "Quando botões colocados perto uns dos outros são percebidos como um mesmo grupo funcional, aplica-se o princípio da Gestalt de:",
        opts: ["Fechamento", "Continuidade", "Proximidade", "Figura e Fundo"],
        ans: 2,
        exp: "Como Continuidade caiu em 2025, Proximidade (itens próximos = mesmo grupo) e Fechamento são apostas fortíssimas!"
      },
      {
        tag: "Aposta 14 • Diretórios Linux vs Comandos",
        q: "Qual opção lista APENAS diretórios padrão reais da raiz do Linux?",
        opts: [
          "/bin, /etc, /mkdir, /lib, /usr, /var, /tmp",
          "/bin, /etc, /home, /lib, /usr, /var, /tmp",
          "/bin, /ls, /home, /cat, /usr, /var, /tmp",
          "/apt, /etc, /home, /cp, /usr, /var, /shutdown"
        ],
        ans: 1,
        exp: "/bin, /etc, /home, /lib, /usr, /var e /tmp são pastas reais. Os demais são comandos do terminal!"
      },
      {
        tag: "Aposta 15 • Produtividade Windows & Office (Prova Irmã FAT)",
        q: "Analise: I. Ctrl+C copia e Ctrl+X recorta para a Área de Transferência. | II. Controlar Alterações do Word registra edições para aceitar/rejeitar. | III. Marcadores e Numeração organizam listas. Quais estão corretas?",
        opts: ["Apenas I", "Apenas I e II", "Apenas II e III", "Todas (I, II e III)"],
        ans: 3,
        exp: "Todas corretas! Questões idênticas caíram nas provas de Administração e Eletrônica da FAT em Dez/2024."
      }
    ];

    let apostaIdx = 0;
    let apostaHits = 0;
    let apostaDone = 0;
    let apostaAnswered = false;

    function renderApostasMode() {
      const stage = document.getElementById("stage");
      if (apostaIdx >= APOSTAS_QUESTIONS.length) {
        const pct = Math.round((apostaHits / APOSTAS_QUESTIONS.length) * 100);
        stage.innerHTML = `
          <div style="text-align:center; padding:24px;">
            <div class="tag-badge">Simulador Premonição Concluído</div>
            <h2>Você acertou ${apostaHits} de ${APOSTAS_QUESTIONS.length} apostas (${pct}%)!</h2>
            <p class="small-muted">Se quiser treinar as 30 questões completas, abra também o arquivo <code>apostila/03_apostas_proxima_prova_fat.md</code>.</p>
            <button class="btn btn-green" onclick="restartApostas()">🔄 Refazer Apostas</button>
          </div>
        `;
        return;
      }

      const q = APOSTAS_QUESTIONS[apostaIdx];
      apostaAnswered = false;
      stage.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <span class="tag-badge" style="margin-bottom:0;">🔮 ${escapeHtml(q.tag)}</span>
          <span class="small-muted"><strong>Questão ${apostaIdx + 1}/${APOSTAS_QUESTIONS.length}</strong> • Acertos: ${apostaHits}/${apostaDone}</span>
        </div>
        <h3 style="margin:12px 0;">${escapeHtml(q.q)}</h3>
        <div class="options-grid" id="apostaOpts"></div>
        <div class="feedback" id="apostaFeedback"></div>
        <div class="controls" style="justify-content:flex-end;">
          <button class="btn btn-green" onclick="nextAposta()">Próxima Aposta ▶</button>
        </div>
      `;

      const grid = document.getElementById("apostaOpts");
      q.opts.forEach((txt, idx) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = txt;
        b.onclick = () => {
          if (apostaAnswered) return;
          apostaAnswered = true;
          apostaDone += 1;
          const fb = document.getElementById("apostaFeedback");
          if (idx === q.ans) {
            b.classList.add("correct");
            apostaHits += 1;
            state.xp += 25;
            state.streak += 1;
            sfxOk();
            fb.className = "feedback show ok";
            fb.textContent = "✅ Acertou a aposta! (+25 XP) — " + q.exp;
          } else {
            b.classList.add("wrong");
            grid.children[q.ans].classList.add("correct");
            state.streak = 0;
            state.hearts = Math.max(0, state.hearts - 1);
            sfxBad();
            fb.className = "feedback show bad";
            fb.textContent = "❌ Pegadinha FAT! " + q.exp;
          }
          saveState();
        };
        grid.appendChild(b);
      });
    }

    function nextAposta() {
      apostaIdx += 1;
      renderApostasMode();
    }

    function restartApostas() {
      apostaIdx = 0;
      apostaHits = 0;
      apostaDone = 0;
      renderApostasMode();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderHud();
    renderTrail();
    renderStage();
  </script>
</body>
