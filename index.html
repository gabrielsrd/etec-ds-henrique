    // ==================== 6. FLASHCARDS, V/F & PARES ====================
    const TAG_LABELS = {
      "ALL": `Todos (${D.flashcards.length})`,
      "REVIEW": "📌 Revisar",
      "01_TPA_CSharp": "1. TPA & C#",
      "02_Web_Design": "2. Web I & UX",
      "03_BD_APS_FI": "3. BD, APS & Fund.",
      "04_Port_Ingles": "4. Port. & Inglês",
      "05_Hum_Aprof": "5. Pesq/Arte/EdF/Hist",
      "06_Exatas": "6. Mat/Fís/Quím",
    };

    function renderCardsArea(root) {
      const vfTotal = (D.vfStatements || []).length;
      root.innerHTML = `
        <section class="panel">
          <div class="subtabs">
            <button class="chip ${cardsMode === "cards" && cardViewStyle === "mc" ? "active" : ""}" onclick="cardsMode='cards'; cardViewStyle='mc'; clearCardMc(); renderMain();">🎯 Flashcards Quiz (${D.flashcards.length})</button>
            <button class="chip ${cardsMode === "cards" && cardViewStyle === "flip" ? "active" : ""}" onclick="cardsMode='cards'; cardViewStyle='flip'; isFlipped=false; renderMain();">🃏 Flashcards 3D</button>
            <button class="chip ${cardsMode === "vf" ? "active" : ""}" onclick="cardsMode='vf'; renderMain();">⚡ Verdade ou Fake (${vfTotal})</button>
            <button class="chip ${cardsMode === "pairs" ? "active" : ""}" onclick="cardsMode='pairs'; renderMain();">🔗 Pares (${D.pairs.length})</button>
          </div>
          <div id="cardsMount"></div>
        </section>
      `;
      const mount = document.getElementById("cardsMount");
      if (cardsMode === "cards") renderCardsOnlyInto(mount, cardsTag, true);
      else if (cardsMode === "vf") renderVfInto(mount);
      else renderPairsInto(mount);
    }

    function fmtInlineCode(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function getVfPool() {
      const all = D.vfStatements || [];
      return vfArea === "ALL" ? all : all.filter((v) => v.area === vfArea);
    }

    function renderVfInto(container) {
      const areas = D.areas || [];
      const pool = getVfPool();
      if (!pool.length) { container.innerHTML = "<p>Nenhuma afirmativa encontrada.</p>"; return; }
      if (vfIdx >= pool.length) vfIdx = 0;
      const item = pool[vfIdx];
      const picked = vfSessionPicked[item.id];
      const areaObj = areas.find((a) => a.id === item.area);

      const allHistEntries = Object.entries(pState.vfHistory || {});
      const totalAns = allHistEntries.length;
      const totalHits = allHistEntries.filter(([, ok]) => ok).length;

      const filterTabs = [
        `<button class="chip ${vfArea === "ALL" ? "active" : ""}" onclick="vfArea='ALL'; vfIdx=0; renderMain();">Todas (${(D.vfStatements || []).length})</button>`,
        ...areas.map((a) => `<button class="chip ${vfArea === a.id ? "active" : ""}" onclick="vfArea='${a.id}'; vfIdx=0; renderMain();">${a.title}</button>`)
      ].join("");

      let fbHtml = "";
      if (picked !== undefined) {
        const acertou = picked === item.isTrue;
        fbHtml = `<div class="q-exp ${acertou ? "ok" : "bad"}" style="margin-top:12px;">
          <strong>${item.verdictTitle}</strong> — ${acertou ? "✅ Acertou (+10 XP)!" : "❌ Atenção à pegadinha:"}<br>
          ${fmtInlineCode(item.explain)}
        </div>`;
      }

      container.innerHTML = `
        <div class="subtabs">${filterTabs}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; font-size:13px;">
          <div><strong>⚡ Verdade ou Fake de Taboão:</strong> julgue rápido (teclas V / F / Espaço)!</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="tag-pill done">Placar: ${totalHits}/${totalAns}</span>
            <span class="tag-pill today">🔥 ${cState.streak} • ${vfIdx + 1}/${pool.length}</span>
          </div>
        </div>
        <div class="q-card" style="background:var(--surface-alt);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
            <span class="tag-pill today">${areaObj ? areaObj.title : item.area}</span>
          </div>
          <h3 style="margin:6px 0 16px 0; font-size:18px; line-height:1.45;">${fmtInlineCode(item.text)}</h3>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px;">
            <button id="vfBtnTrue" class="btn lg ${picked === undefined ? "green" : (item.isTrue ? "green" : (picked === true ? "red" : "outline"))}" onclick="answerVf(true, ${item.id})">✅ É VERDADE (V)</button>
            <button id="vfBtnFalse" class="btn lg ${picked === undefined ? "red" : (!item.isTrue ? "green" : (picked === false ? "red" : "outline"))}" onclick="answerVf(false, ${item.id})">❌ É FAKE! (F)</button>
          </div>
          ${fbHtml}
        </div>
        <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:12px;">
          <button class="btn sm dark" onclick="vfIdx=(vfIdx-1+${pool.length})%${pool.length}; renderMain();">◀ Anterior</button>
          <button class="btn sm purple" onclick="pickRandomVf(${pool.length})">🎲 Sortear</button>
          <button id="vfNextBtn" class="btn sm green" onclick="vfIdx=(vfIdx+1)%${pool.length}; renderMain();">Próxima ▶</button>
          <button class="btn sm outline" onclick="vfSessionPicked={}; renderMain();">🔄 Nova Rodada</button>
        </div>
      `;
    }

    function answerVf(userSaidTrue, itemId) {
      if (vfSessionPicked[itemId] !== undefined) return;
      const item = (D.vfStatements || []).find((v) => v.id === itemId);
      if (!item) return;
      vfSessionPicked[itemId] = userSaidTrue;
      const isOk = userSaidTrue === item.isTrue;
      pState.vfHistory = pState.vfHistory || {};
      pState.vfHistory[String(itemId)] = isOk;
      if (isOk) { cState.xp += 10; cState.streak += 1; sfxOk(); }
      else { cState.streak = 0; sfxBad(); }
      saveCardsState();
      savePlatformState();
      renderMain();
    }

    function pickRandomVf(len) {
      if (len > 1) {
        let next = Math.floor(Math.random() * len);
        if (next === vfIdx) next = (vfIdx + 1) % len;
        vfIdx = next;
      }
      renderMain();
    }

    function getOrBuildCardMc(item) {
      if (cardMcCache[item.idx]) return cardMcCache[item.idx];
      const usedTexts = new Set([item.back]);
      const sameTag = D.flashcards.filter((c) => c.tag === item.tag && c.front !== item.front).sort(() => Math.random() - 0.5);
      const others = D.flashcards.filter((c) => c.tag !== item.tag && c.front !== item.front).sort(() => Math.random() - 0.5);
      const distractors = [];
      for (const cand of [...sameTag, ...others]) {
        if (!usedTexts.has(cand.back)) {
          usedTexts.add(cand.back);
          distractors.push({ text: cand.back, isCorrect: false });
          if (distractors.length === 3) break;
        }
      }
      const options = [{ text: item.back, isCorrect: true }, ...distractors].sort(() => Math.random() - 0.5);
      cardMcCache[item.idx] = { cardIdx: item.idx, options, picked: null };
      return cardMcCache[item.idx];
    }

    function answerCardMc(optIdx, cardGlobalIdx) {
      const mc = cardMcCache[cardGlobalIdx];
      if (!mc || mc.picked !== null) return;
      mc.picked = optIdx;
      const isRight = mc.options[optIdx].isCorrect;
      if (isRight) {
        if (!cState.known.includes(cardGlobalIdx)) cState.known.push(cardGlobalIdx);
        cState.review = cState.review.filter((i) => i !== cardGlobalIdx);
        cState.xp += 15; cState.streak += 1; sfxOk();
      } else {
        if (!cState.review.includes(cardGlobalIdx)) cState.review.push(cardGlobalIdx);
        cState.known = cState.known.filter((i) => i !== cardGlobalIdx);
        cState.streak = 0; sfxBad();
      }
      saveCardsState();
      renderMain();
    }

    function pickRandomCard(listLen) {
      if (listLen > 1) {
        let next = Math.floor(Math.random() * listLen);
        if (next === cardIdx) next = (cardIdx + 1) % listLen;
        cardIdx = next;
      }
      isFlipped = false; clearCardMc(); renderMain();
    }

    function renderCardsOnlyInto(container, tagFilter, showTrail = false) {
      let list = D.flashcards.map((c, idx) => ({ ...c, idx }));
      let fallbackNote = "";
      if (tagFilter === "REVIEW") {
        const activeMcIds = Object.keys(cardMcCache).filter((k) => cardMcCache[k].picked !== null).map(Number);
        const rev = list.filter((c) => cState.review.includes(c.idx) || activeMcIds.includes(c.idx));
        if (rev.length > 0 || showTrail) list = rev;
        else fallbackNote = `<div class="callout callout-note" style="margin-bottom:10px;">Sem cards pendentes na fila — exibindo o baralho completo (${list.length} cards).</div>`;
      } else if (tagFilter !== "ALL") list = list.filter((c) => c.tag === tagFilter);

      const trailHtml = showTrail
        ? `<div class="subtabs">${Object.entries(TAG_LABELS).map(([k, lb]) => `<button class="chip ${cardsTag === k ? "active" : ""}" onclick="cardsTag='${k}'; cardIdx=0; isFlipped=false; clearCardMc(); renderMain();">${lb}${k === "REVIEW" ? ` (${cState.review.length})` : ""}</button>`).join("")}</div>`
        : "";

      if (list.length === 0) {
        container.innerHTML = `${trailHtml}<div style="text-align:center; padding:24px;"><h3>Nenhum card nesta fila!</h3></div>`;
        return;
      }
      if (cardIdx >= list.length) cardIdx = 0;
      const item = list[cardIdx];
      const known = cState.known.includes(item.idx);
      const inReview = cState.review.includes(item.idx);
      const statusLabel = known ? "• ✅ Dominado" : (inReview ? "• 🔁 Revisar" : "");

      const modeSwitcherHtml = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
          <span style="font-size:13px; color:var(--muted);">Card ${cardIdx + 1}/${list.length} <strong>${statusLabel}</strong></span>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="chip ${cardViewStyle === "mc" ? "active" : ""}" onclick="cardViewStyle='mc'; clearCardMc(); renderMain();">🎯 Quiz (A-D)</button>
            <button class="chip ${cardViewStyle === "flip" ? "active" : ""}" onclick="cardViewStyle='flip'; isFlipped=false; renderMain();">🃏 Virar 3D</button>
          </div>
        </div>
      `;

      if (cardViewStyle === "mc") {
        const mc = getOrBuildCardMc(item);
        const optsHtml = mc.options.map((opt, oi) => {
          let cls = "opt-item";
          if (mc.picked !== null) {
            if (opt.isCorrect) cls += " correct";
            else if (oi === mc.picked) cls += " wrong";
          }
          return `<button class="${cls}" onclick="answerCardMc(${oi}, ${item.idx})"><span class="opt-letter">(${"ABCD"[oi]})</span><span>${escapeHtml(opt.text)}</span></button>`;
        }).join("");

        let fbHtml = "";
        if (mc.picked !== null) {
          fbHtml = mc.options[mc.picked].isCorrect

    function markCardKnown(idx, len) {
      if (!cState.known.includes(idx)) cState.known.push(idx);
      cState.review = cState.review.filter((i) => i !== idx);
      cState.xp += 10; cState.streak += 1; sfxOk();
      cardIdx = (cardIdx + 1) % Math.max(1, len); isFlipped = false; clearCardMc();
      saveCardsState(); renderMain();
    }
    function markCardReview(idx, len) {
      if (!cState.review.includes(idx)) cState.review.push(idx);
      cState.known = cState.known.filter((i) => i !== idx);
      cardIdx = (cardIdx + 1) % Math.max(1, len); isFlipped = false; clearCardMc();

    function pickPair(side, el) {
      if (el.classList.contains("matched")) return;
      const col = el.parentElement;
      col.querySelectorAll(".pair-item").forEach((x) => x.classList.remove("selected"));
      el.classList.add("selected");
      if (side === "left") pairState.leftSel = el; else pairState.rightSel = el;
      if (pairState.leftSel && pairState.rightSel) {
        const l = pairState.leftSel, r = pairState.rightSel;
        pairState.leftSel = null; pairState.rightSel = null;
        if (l.dataset.term === r.dataset.term) {
          l.classList.remove("selected"); r.classList.remove("selected");
          l.classList.add("matched"); r.classList.add("matched");
          pairState.matched += 1; cState.xp += 10; cState.streak += 1; sfxOk();
          if (pairState.matched === pairState.total) {
            cState.xp += 20;
            const msg = l.closest("div.pairs-wrap").nextElementSibling;
            if (msg) msg.textContent = "🎉 Rodada completa! (+20 XP bônus)";
          }
          saveCardsState();
        } else {
          l.classList.add("error"); r.classList.add("error");
          cState.streak = 0; sfxBad(); saveCardsState();
          setTimeout(() => { l.classList.remove("selected","error"); r.classList.remove("selected","error"); }, 450);
        }
      }
    }

      const out = ["Passo | y   | y % 2 | y / 2 | binário"];

      document.getElementById("l2MesaOut").textContent = out.join("\n");
    }

          <strong>Ligue ou Desligue os 8 Bits de 1 Byte (187 = BB repetiu 2x em Taboão!)</strong><br><br>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;" id="lbBitRow"></div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
            <small><strong>Atalhos Taboão:</strong></small>
            <button class="btn sm amber" onclick="lbSetVal(187)">⭐ 187 = BB (2024 &amp; 2025!)</button>
            <button class="btn sm" onclick="lbSetVal(205)">205 = CD</button>
            <button class="btn sm" onclick="lbSetVal(250)">250 = FA</button>
            <button class="btn sm" onclick="lbSetVal(255)">255 = FF</button>
            <button class="btn sm dark" onclick="lbSetVal(0)">Zerar</button>
          </div>
          <pre class="q-code" id="lbOut"></pre>
        </div>
      `;
      lbDraw();
    }
    function lbSetVal(n) {
      const x = Math.max(0, Math.min(255, Math.trunc(n)));
      lbBits = LB_WEIGHTS.map((w) => ((x & w) ? 1 : 0));
      lbDraw();
    }
    function lbToggleBit(i) { lbBits[i] = lbBits[i] ? 0 : 1; lbDraw(); }
    function lbDraw() {
      const row = document.getElementById("lbBitRow");
      if (!row) return;
      row.innerHTML = LB_WEIGHTS.map((w, i) => `
        <button class="btn sm ${lbBits[i] ? "green" : "dark"}" style="min-width:56px; display:flex; flex-direction:column; align-items:center; padding:8px 6px;" onclick="lbToggleBit(${i})">
          <span style="font-size:16px; font-weight:800;">${lbBits[i]}</span>
          <small style="opacity:0.85; font-size:11px;">${w}</small>
        </button>
      `).join("");
      let dec = 0;
      const parts = [];
      lbBits.forEach((b, i) => { if (b) { dec += LB_WEIGHTS[i]; parts.push(LB_WEIGHTS[i]); } });
      const hex = dec.toString(16).toUpperCase().padStart(2, "0");
      const q16 = Math.floor(dec / 16), r16 = dec % 16;
      const hexDig = (n) => n.toString(16).toUpperCase();
      document.getElementById("lbOut").textContent =
        `Binário (Base 2):      ${lbBits.join("")}₂\nDecimal (Base 10):     ${dec}₁₀   (${parts.length ? parts.join(" + ") : "0"} = ${dec})\nHexadecimal (Base 16): ${hex}₁₆   (${dec} ÷ 16 = quociente ${q16} [${hexDig(q16)}], resto ${r16} [${hexDig(r16)}])`;
    }

    function renderLabMTecInto(el) {
      el.innerHTML = `
        <h3>🎓 Lab Base Comum — Logaritmo, Venn, Massa Molar &amp; Óptica</h3>
        <div class="lab-grid">
          <div class="q-card">
            <strong>1. Massa Molar (C=12, H=1, O=16) &amp; Condutividade</strong><br><br>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
              <button class="btn sm" onclick="lmSetMol(2,6,1,'Etanol (C₂H₅OH)')">Etanol</button>
              <button class="btn sm" onclick="lmSetMol(2,4,2,'Ácido Acético (C₂H₄O₂)')">Ác. Acético</button>
              <button class="btn sm" onclick="lmSetMol(0,2,1,'Água (H₂O)')">Água</button>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <label>C <input id="lmC" type="number" min="0" max="20" value="2" style="width:52px; padding:4px;" oninput="lmCalcMol()"></label>
              <label>H <input id="lmH" type="number" min="0" max="40" value="6" style="width:52px; padding:4px;" oninput="lmCalcMol()"></label>
              <label>O <input id="lmO" type="number" min="0" max="20" value="1" style="width:52px; padding:4px;" oninput="lmCalcMol()"></label>
            </div>
            <pre class="q-code" id="lmMolOut"></pre>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
              <button class="btn sm outline" onclick="lmCond('metal')">Metal</button>
              <button class="btn sm outline" onclick="lmCond('ionica')">Iônico (Sal)</button>
              <button class="btn sm outline" onclick="lmCond('covalente')">Molecular</button>
            </div>
            <pre class="q-code" id="lmCondOut">Escolha um material acima para ver quando conduz eletricidade.</pre>
          </div>
          <div class="q-card">
            <strong>2. Macetes de Matemática &amp; Física Taboão</strong><br><br>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
              <button class="btn sm green" onclick="lmMathDemo('venn')">Venn (Taboão)</button>
              <button class="btn sm purple" onclick="lmMathDemo('log')">Logaritmo</button>
              <button class="btn sm amber" onclick="lmMathDemo('gas')">Gases p×V</button>
            </div>
            <pre class="q-code" id="lmMathOut"></pre>
            <div style="margin-top:8px;">
              <strong>Óptica das Cores:</strong>
              <select id="lmObj" onchange="lmOptics()" style="padding:4px;"><option value="red">Objeto Vermelho</option><option value="white">Objeto Branco</option><option value="blue">Objeto Azul</option></select>
              sob luz
              <select id="lmLight" onchange="lmOptics()" style="padding:4px;"><option value="white">Branca</option><option value="green">Verde</option><option value="red">Vermelha</option></select>
              <div id="lmOptOut" style="margin-top:6px; padding:8px 12px; border-radius:8px; font-weight:800;"></div>
            </div>
          </div>
        </div>
      `;
      lmCalcMol("Etanol (C₂H₅OH)"); lmMathDemo("venn"); lmOptics();
    }
    function lmSetMol(c, h, o, nome) {
      document.getElementById("lmC").value = c; document.getElementById("lmH").value = h; document.getElementById("lmO").value = o;
      lmCalcMol(nome);
    }
    function lmCalcMol(label = "Molécula") {
      const c = Number(document.getElementById("lmC").value) || 0, h = Number(document.getElementById("lmH").value) || 0, o = Number(document.getElementById("lmO").value) || 0;
      document.getElementById("lmMolOut").textContent = `${label}: (${c}×12) + (${h}×1) + (${o}×16) = ${c*12 + h + o*16} g/mol`;
    }
    function lmCond(tipo) {
      const map = {
        metal: "METAL (Ferro, Cobre): CONDUZ eletricidade no estado SÓLIDO (e líquido)!",
        ionica: "IÔNICO (NaCl): NÃO conduz sólido! Só CONDUZ líquido/fundido ou dissolvido em água!",
        covalente: "MOLECULAR (Açúcar, H₂O pura): NÃO conduz nem sólido nem líquido!",
      };
      document.getElementById("lmCondOut").textContent = map[tipo];
    }
    function lmMathDemo(kind) {
      const el = document.getElementById("lmMathOut");
      if (kind === "venn") el.textContent = "Venn Taboão: Total=170, A=92, B=88, Nenhum=20\n1) 170 - 20 = 150 leem algo\n2) 92 + 88 = 180\n3) Interseção (os dois) = 180 - 150 = 30!";
      else if (kind === "log") el.textContent = "Log Taboão: log_a(m)=11, log_a(n)=6\nlog_a(m² · n²) = 2·log_a(m) + 2·log_a(n)\n= 2(11) + 2(6) = 22 + 12 = 34!";
      else el.textContent = "Gases Taboão (repetiu 2x!):\n(P₁·V₁)/T₁ = (P₂·V₂)/T₂ (T sempre em Kelvin!)\nSe P é constante e V dobra (V -> 2V), então T também DOBRA: 300 K -> 600 K!";
    }
    function lmOptics() {
      const obj = (document.getElementById("lmObj") && document.getElementById("lmObj").value) || "red";
      const lig = (document.getElementById("lmLight") && document.getElementById("lmLight").value) || "white";
      let seen = "PRETO", bg = "#0f172a", fg = "#ffffff", why = "absorve a luz e não reflete nada!";
      if (obj === "white") {
        const names = ({ white: ["BRANCO", "#f8fafc", "#0f172a"], red: ["VERMELHO", "#dc2626", "#fff"], green: ["VERDE", "#16a34a", "#fff"] })[lig] || ["BRANCO", "#f8fafc", "#0f172a"];
        seen = names[0]; bg = names[1]; fg = names[2]; why = "superfície branca reflete toda cor recebida!";
      } else if (lig === "white" || obj === lig) {
        const names = ({ red: ["VERMELHO", "#dc2626", "#fff"], blue: ["AZUL", "#2563eb", "#fff"] })[obj] || ["VERMELHO", "#dc2626", "#fff"];
        seen = names[0]; bg = names[1]; fg = names[2]; why = "reflete a própria cor presente na luz!";
      }
      const out = document.getElementById("lmOptOut");
      if (out) {
        out.style.background = bg; out.style.color = fg;
        out.textContent = `Cor enxergada: ${seen} — ${why}`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
      document.addEventListener("keydown", (e) => {
        if (activeTab !== "cards" || cardsMode !== "vf") return;
        const tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key === "v" || e.key === "V") { const btn = document.getElementById("vfBtnTrue"); if (btn) btn.click(); }
        else if (e.key === "f" || e.key === "F") { const btn = document.getElementById("vfBtnFalse"); if (btn) btn.click(); }
        else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); const btn = document.getElementById("vfNextBtn"); if (btn) btn.click(); }
      });
    }

    if (typeof navigator !== "undefined" && "serviceWorker" in navigator && window.location && window.location.protocol && window.location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    initTheme();
    renderMain();
  </script>
</body>
