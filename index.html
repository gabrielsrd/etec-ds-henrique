<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>ETEC Taboão da Serra — 2ª Série M-Tec DS (04/12 &amp; 08/12)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --primary: #2563eb;
      --primary-dark: #1e3a8a;
      --primary-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --green-text: #14532d;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-text: #78350f;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --red-text: #7f1d1d;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --code-bg: #0f172a;
      --code-fg: #f8fafc;
      --inline-code-bg: #f1f5f9;
      --inline-code-fg: #be123c;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-alt: #1e293b;
      --primary: #3b82f6;
      --primary-dark: #93c5fd;
      --primary-soft: rgba(59, 130, 246, 0.22);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.16);
      --green-text: #bbf7d0;
      --purple: #a78bfa;
      --purple-soft: rgba(139, 92, 246, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --amber-text: #fde68a;
      --red: #f87171;
      --red-soft: rgba(239, 68, 68, 0.16);
      --red-text: #fecaca;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --border-soft: #1f2937;
      --code-bg: #020617;
      --code-fg: #e2e8f0;
      --inline-code-bg: #1e293b;
      --inline-code-fg: #fda4af;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 48px; transition: background 0.2s, color 0.2s; }

    /* Top Bar */
    .topbar {
      background: #0f172a; color: #fff; position: sticky; top: 0; z-index: 60;
      border-bottom: 3px solid var(--primary);
    }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; padding: 10px 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
    .brand-sub { font-weight: 600; opacity: 0.78; font-size: 12.5px; }
    .hud-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; font-weight: 700; }
    .hud-pill { background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

    /* Desktop Nav Bar */
    .nav-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 49px; z-index: 50;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 8px 14px;
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 9px 14px; border-radius: 10px; border: 2px solid transparent; background: var(--surface-alt);
      font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap; color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: var(--primary-soft); }
    .nav-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }

    /* Mobile Bottom Nav Bar */
    .mobile-bottom-nav {
      display: none;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.12);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) 4px;
      grid-template-columns: repeat(5, 1fr); gap: 2px;
    }
    .mb-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-height: 50px; border: none; background: transparent; color: var(--muted);
      font-size: 11px; font-weight: 700; border-radius: 10px; cursor: pointer; padding: 4px 2px;
    }
    .mb-btn .mb-ico { font-size: 18px; line-height: 1; }
    .mb-btn.active { color: var(--primary); background: var(--primary-soft); }

    .container { max-width: 1140px; margin: 16px auto; padding: 0 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .panel, .lesson-body, #chapterStepBody { min-width: 0; }
    .lesson-body { overflow-wrap: break-word; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow);
    }

    /* Hero & Coach */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #312e81 100%); color: #fff;
      border-radius: 18px; padding: 22px; display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: center;
      box-shadow: 0 10px 28px rgba(30, 58, 138, 0.25);
    }
    .countdown-box {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px; padding: 14px; display: grid; gap: 10px;
    }
    .cd-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; background: rgba(15, 23, 42, 0.28); border-radius: 10px; }
    .countdown-num { font-size: 20px; font-weight: 900; }

    .coach { border-radius: 14px; padding: 16px 18px; border: 2px solid; display: grid; gap: 8px; }
    .coach.ok { background: var(--green-soft); border-color: var(--green); color: var(--green-text); }
    .coach.warn { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-text); }
    .coach.danger { background: var(--red-soft); border-color: var(--red); color: var(--red-text); }
    .coach-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    /* Buttons & Badges */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; min-height: 42px; border-radius: 10px; border: none; background: var(--primary);
      color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none;
      transition: transform 0.08s, filter 0.15s;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.lg { padding: 12px 20px; min-height: 48px; font-size: 15px; border-radius: 12px; }
    .btn.sm { padding: 7px 12px; min-height: 36px; font-size: 12.5px; border-radius: 8px; }
    .btn.green { background: #16a34a; color: #fff; }
    .btn.purple { background: #7c3aed; color: #fff; }
    .btn.amber { background: #d97706; color: #fff; }
    .btn.red { background: #dc2626; color: #fff; }
    .btn.dark { background: #334155; color: #fff; }
    .btn.outline { background: var(--surface); color: var(--text); border: 2px solid var(--border); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
    .kpi-label { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .kpi-val { font-size: 22px; font-weight: 800; margin-top: 2px; }
    .track { height: 10px; background: var(--border-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; position: relative; }
    .fill { height: 100%; background: var(--green); transition: width 0.3s; border-radius: 999px; }

    /* Story Mode & Exam Cards */
    .story-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
    .chap-card {
      border: 2px solid var(--border-soft); border-radius: 14px; padding: 15px; background: var(--surface);
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .chap-card.done { border-color: var(--green); background: var(--green-soft); }
    .chap-card.today { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.16); }
    .chap-card.late { border-color: var(--red); background: var(--red-soft); }
    .chap-card.featured { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(217,119,6,0.18); }

    .tag-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: var(--surface-alt); color: var(--muted); border: 1px solid var(--border-soft); }
    .tag-pill.done { background: var(--green-soft); color: var(--green-text); border-color: var(--green); }
    .tag-pill.today { background: var(--primary-soft); color: var(--primary-dark); border-color: var(--primary); }
    .tag-pill.late { background: var(--red-soft); color: var(--red-text); border-color: var(--red); }
    .tag-pill.amber { background: var(--amber-soft); color: var(--amber-text); border-color: var(--amber); }

    .stepper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 2px solid var(--border-soft); padding-bottom: 12px; }
    .step-pill {
      padding: 9px 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface-alt);
      font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--text);
    }
    .step-pill.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }
    .step-pill.done { background: var(--green-soft); border-color: var(--green); color: var(--green-text); }

    /* Lesson / Apostila typography */
    .lesson-body h1, .lesson-body h2 { color: var(--primary-dark); border-left: 4px solid var(--primary); padding-left: 10px; margin-top: 20px; font-size: 19px; }
    .lesson-body h3 { color: var(--text); margin-top: 16px; font-size: 16px; }
    .lesson-body code { background: var(--inline-code-bg); color: var(--inline-code-fg); padding: 2px 5px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 90%; }
    .lesson-body pre { background: var(--code-bg); color: var(--code-fg); padding: 13px; border-radius: 10px; overflow-x: auto; font-size: 13px; line-height: 1.5; border: 1px solid #334155; }
    .lesson-body pre code { background: transparent; color: var(--code-fg); padding: 0; }
    .lesson-body pre, .lesson-body pre code, .lesson-body pre span, .q-exp pre, .q-exp code, pre.q-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace !important; }
    .lesson-body div.sourceCode { margin: 10px 0; }
    .lesson-body pre { white-space: pre; tab-size: 4; }
    code span.kw, code span.cf, code span.dt { color: #93c5fd; }   /* palavras-chave e tipos */
    code span.st, code span.ch { color: #fcd34d; }                  /* textos entre aspas */
    code span.co { color: #94a3b8; font-style: italic; }           /* comentários */
    code span.dv, code span.fl, code span.bn { color: #f9a8d4; }    /* números */
    code span.fu { color: #6ee7b7; }                                /* funções */
    code span.op { color: #e2e8f0; }
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0 16px 0; border-radius: 10px; border: 1px solid var(--border); }
    .q-table { width: 100%; border-collapse: collapse; margin: 0; font-size: 13.5px; min-width: 480px; }
    .q-table th { background: #1e3a8a; color: #fff; padding: 8px 10px; text-align: left; border-bottom: 1px solid #1e3a8a; }
    .q-table td { padding: 8px 10px; border-top: 1px solid var(--border-soft); vertical-align: top; }
    .q-table tr:nth-child(even) td { background: var(--surface-alt); }

    .callout { padding: 12px 15px; border-radius: 10px; margin: 12px 0; font-size: 14px; }
    .callout-warning { background: var(--amber-soft); border-left: 5px solid var(--amber); color: var(--text); }
    .callout-caution { background: var(--red-soft); border-left: 5px solid var(--red); color: var(--text); }
    .callout-note, .callout-tip, .callout-important { background: var(--primary-soft); border-left: 5px solid var(--primary); color: var(--text); }

    /* Interactive Recall & Accordion Boxes */
    details.recall-box {
      background: var(--purple-soft); border: 2px solid var(--purple); border-radius: 12px;
      padding: 12px 14px; margin: 14px 0;
    }
    details.recall-box summary {
      font-weight: 800; cursor: pointer; color: var(--text); list-style: none;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    details.recall-box summary::-webkit-details-marker { display: none; }
    details.recall-box, details.recall-box summary { overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
    details.recall-box summary::after { content: "▼ Abrir"; font-size: 12px; color: var(--purple); white-space: nowrap; }
    details.recall-box[open] summary::after { content: "▲ Ocultar"; }
    details.recall-box[open] summary { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }

    details.extra-exams-box {
      border: 2px dashed var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface-alt);
    }
    details.extra-exams-box summary {
      font-weight: 800; font-size: 15px; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }

    /* Questions & Simulator */
    .q-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: var(--surface); margin-bottom: 14px; }
    .q-card, .lesson-body p, .lesson-body li { overflow-wrap: anywhere; }
    .q-card pre { background: var(--code-bg); color: var(--code-fg); padding: 11px 12px; border-radius: 9px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; border: 1px solid #334155; }
    .q-card pre code { background: transparent; color: var(--code-fg); padding: 0; }
    .q-card code { background: var(--inline-code-bg); color: var(--inline-code-fg); padding: 1px 4px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 90%; }
    .q-card table { border-collapse: collapse; font-size: 13px; }
    .q-card th, .q-card td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
    .q-card blockquote { margin: 8px 0; padding: 6px 12px; border-left: 4px solid var(--border); color: var(--text); }
    .q-exp .callout { margin: 0 0 8px 0; }
    .q-exp p:first-child { margin-top: 0; }
    .q-card img { max-width: 100%; height: auto; display: block; margin: 12px auto; border-radius: 10px; background: #ffffff; padding: 6px; border: 1px solid var(--border); }
    .q-quote { border-left: 4px solid #64748b; background: var(--surface-alt); padding: 10px 12px; margin: 8px 0; border-radius: 6px; font-size: 14px; }
    .q-code { background: var(--code-bg); color: var(--code-fg); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid #334155; }
    .q-infographic { background: var(--primary-soft); border: 1px solid var(--primary); border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 13.5px; }
    .opts-list { display: grid; gap: 8px; margin-top: 12px; }
    .opt-item {
      display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
      padding: 12px 13px; min-height: 48px; border-radius: 10px; border: 2px solid var(--border-soft);
      background: var(--surface); cursor: pointer; font-size: 14.5px; color: var(--text);
      transition: background 0.12s, border-color 0.12s;
    }
    .opt-item:hover { background: var(--surface-alt); border-color: var(--border); }
    .opt-item.selected { border-color: var(--primary); background: var(--primary-soft); }
    .opt-item.correct { border-color: var(--green); background: var(--green-soft); color: var(--green-text); }
    .opt-item.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red-text); }
    .opt-letter { font-weight: 800; min-width: 26px; }
    .q-exp { margin-top: 10px; padding: 11px 13px; border-radius: 10px; font-size: 13.5px; }
    .q-exp.ok { background: var(--green-soft); color: var(--green-text); border: 1px solid var(--green); }
    .q-exp.bad { background: var(--red-soft); color: var(--red-text); border: 1px solid var(--red); }

    .sim-palette { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .pal-btn {
      width: 35px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-weight: 700; font-size: 12.5px; cursor: pointer;
    }
    .pal-btn.cur { border: 2px solid var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
    .pal-btn.ans { background: var(--surface-alt); border-color: var(--muted); }
    .pal-btn.ok { background: var(--green-soft); border-color: var(--green); color: var(--green-text); }
    .pal-btn.bad { background: var(--red-soft); border-color: var(--red); color: var(--red-text); }

    /* Cutoff Meter */
    .meter-wrap { position: relative; height: 18px; background: var(--border-soft); border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .meter-fill { height: 100%; border-radius: 999px; transition: width 0.35s; }
    .meter-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #0f172a; opacity: 0.7; }
    [data-theme="dark"] .meter-mark { background: #ffffff; }

    /* Flashcards 3D & Pairs */
    .scene { perspective: 1100px; max-width: 640px; margin: 10px auto; }
    .card3d { width: 100%; min-height: 230px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
    .card3d.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px;
      border: 2px solid var(--border); border-bottom-width: 5px; padding: 20px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      background: var(--surface); color: var(--text);
    }
    .face.back { transform: rotateY(180deg); background: var(--green-soft); border-color: var(--green); color: var(--green-text); }
    .pairs-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .pair-col { display: grid; gap: 8px; }
    .pair-item { padding: 11px 12px; min-height: 46px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13.5px; text-align: left; }
    .pair-item.selected { border-color: var(--primary); background: var(--primary-soft); }
    .pair-item.matched { border-color: var(--green); background: var(--green-soft); color: var(--green-text); opacity: 0.72; cursor: default; }
    .pair-item.error { border-color: var(--red); background: var(--red-soft); }

    /* Sub-tabs, Labs & Phase 2 */
    .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { padding: 7px 13px; min-height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .lab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .viewport { height: 200px; border: 2px dashed var(--muted); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--surface-alt); }
    .css-box { width: 80px; height: 80px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 10px; transition: transform 0.3s; margin: 20px auto; }
    .code-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: #1e293b; color: #e2e8f0; padding: 8px 12px; border-radius: 10px 10px 0 0; font-size: 12.5px; font-weight: 700; }
    .code-block-p2 { margin: 0 0 14px 0; border-radius: 0 0 10px 10px; border-top: none; }
    .check-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-alt); cursor: pointer; }
    .check-item input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); flex-shrink: 0; }

    /* Responsive Mobile-First */
    @media (max-width: 780px) {
      body { padding-bottom: 78px; }
      .hero { grid-template-columns: 1fr; padding: 18px; }
      .pairs-wrap { grid-template-columns: 1fr; }
      .hide-mobile { display: none !important; }
      .nav-bar { top: 48px; }
      .mobile-bottom-nav { display: grid; }
      .panel { padding: 15px; border-radius: 14px; }
      .container { padding: 0 10px; margin: 12px auto; gap: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">🎯 ETEC Taboão M-Tec DS <span class="brand-sub hide-mobile">(04/12 &amp; 08/12)</span></div>
      <div class="hud-pills">
        <span class="hud-pill" id="topCountdown">⏳ -- dias</span>
        <span class="hud-pill hide-mobile" id="topChapters">🗺️ 0/16 dias</span>
        <span class="hud-pill hide-mobile" id="topCards">🃏 0/102 cards</span>
        <span class="hud-pill hide-mobile" id="topXp">⭐ 0 XP</span>
        <button class="btn sm purple" onclick="toggleSyncPanel()" title="Sincronizar PC ↔ Celular">📲 Sync</button>
        <button class="btn sm dark" id="themeBtn" onclick="toggleTheme()" title="Alternar Modo Claro / Escuro">🌙</button>
        <button class="btn sm dark hide-mobile" id="soundBtn" onclick="toggleSound()">🔊 Som</button>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="nav-inner" id="mainNav">
      <button class="nav-btn active" onclick="goTab('home')">🏠 Início</button>
      <button class="nav-btn" onclick="goTab('story')">🗺️ Trilha (16 Dias)</button>
      <button class="nav-btn" onclick="goTab('sim')">📝 Provas (40Q)</button>
      <button class="nav-btn" onclick="goTab('phase2')">🛠️ 2ª Fase (08/12)</button>
      <button class="nav-btn" onclick="goTab('apostila')">📖 Apostila &amp; Cola</button>
      <button class="nav-btn" onclick="goTab('cards')">🃏 Cards &amp; V/F</button>
      <button class="nav-btn" onclick="goTab('labs')">🧪 Micro-Labs</button>
    </div>
  </nav>

  <div class="container" id="syncModalHost" style="padding-bottom:0;"></div>
  <main class="container" id="appRoot"></main>

  <nav class="mobile-bottom-nav" id="mobileNav" aria-label="Navegação rápida">
    <button class="mb-btn active" data-tab="home" onclick="goTab('home')"><span class="mb-ico">🏠</span><span>Início</span></button>
    <button class="mb-btn" data-tab="story" onclick="goTab('story')"><span class="mb-ico">🗺️</span><span>Trilha</span></button>
    <button class="mb-btn" data-tab="sim" onclick="goTab('sim')"><span class="mb-ico">📝</span><span>Provas</span></button>
    <button class="mb-btn" data-tab="phase2" onclick="goTab('phase2')"><span class="mb-ico">🛠️</span><span>2ª Fase</span></button>
    <button class="mb-btn" data-tab="cards" onclick="goTab('cards')"><span class="mb-ico">🃏</span><span>Cards</span></button>
  </nav>

  <script src="./dados_plataforma.js?v=20261121g"></script>
  <script>
    const D = window.ETEC_DATA;
    if (!D) {
      document.getElementById("appRoot").innerHTML = "<div class='panel'><h2>Erro ao carregar dados_plataforma.js</h2><p>Extraia todo o arquivo .zip antes de abrir o COMECE_AQUI.html.</p></div>";
      throw new Error("ETEC_DATA missing");
    }

    // Preserva 100% as chaves de localStorage para manter todo histórico do Henrique!
    const STORE_CENTRAL = "etec_platform_v2";
    const STORE_CARDS = "etec_ds_quest_v1";
    const THEME_KEY = "etec_theme";

    // Calendário real dos 16 dias (21/11 -> 03/12 para 1ª Fase; 05/12 -> 07/12 para 2ª Fase; 04/12 é o Dia da Prova Escrita!)
    const REAL_DAY_ISOS = {
      1: "2026-11-21", 2: "2026-11-22", 3: "2026-11-23", 4: "2026-11-24",
      5: "2026-11-25", 6: "2026-11-26", 7: "2026-11-27", 8: "2026-11-28",
      9: "2026-11-29", 10: "2026-11-30", 11: "2026-12-01", 12: "2026-12-02",
      13: "2026-12-03", 14: "2026-12-05", 15: "2026-12-06", 16: "2026-12-07"
    };

    let pState = loadPlatformState();
    let cState = loadCardsState();
    let activeTab = "home";
    let activeChapter = null; // 1..16
    let chapterStep = 1; // 1=Lição, 2=Prática, 3=Desafio
    let simDateOverride = null;
    let soundOn = true;
    let audioCtx = null;

    // Exam simulator & Revanche state
    let simSession = null;
    let simTimerId = null;
    let revancheMode = false;
    let revancheAnswers = {};
    let lastReportMsg = "";

    // Phase 2 Lab state
    let activePhase2Tab = "p2_web";

    // Apostila state
    let activeApostilaId = "cola";
    let apostilaQuery = "";

    // Cards/VF/Labs state
    let cardsMode = "cards";
    let cardViewStyle = "mc";
    let cardMcCache = {};
    let cardsTag = "ALL";
    let cardIdx = 0;
    let isFlipped = false;
    let vfArea = "ALL";
    let vfIdx = 0;
    let vfSessionPicked = {};
    let activeLabTab = "lab_tipos";
    function clearCardMc() { cardMcCache = {}; }

    // Theme (Light / Dark)
    function initTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          const b = document.getElementById("themeBtn");
          if (b) b.textContent = "☀️";
        }
      } catch (e) {}
    }
    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      if (next === "dark") document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      const b = document.getElementById("themeBtn");
      if (b) b.textContent = next === "dark" ? "☀️" : "🌙";
    }

    function loadPlatformState() {
      try {
        const raw = localStorage.getItem(STORE_CENTRAL);
        if (raw) {
          const obj = JSON.parse(raw);
          if (!obj.moduleScores) obj.moduleScores = {};
          if (!obj.examScores) obj.examScores = {};
          if (!obj.completedDays) obj.completedDays = [];
          if (!obj.qHistory) obj.qHistory = {};
          if (!obj.wrongQueue) obj.wrongQueue = [];
          // Remove erros pendentes de provas/questões que não existem mais (provas FAT e simulados antigos removidos)
          obj.wrongQueue = obj.wrongQueue.filter((k) => {
            const i = k.lastIndexOf("_");
            const ex = D.exams[k.slice(0, i)];
            return !!(ex && ex.questions.some((q) => q.num === Number(k.slice(i + 1))));
          });
          if (!obj.vfHistory) obj.vfHistory = {};
          if (!obj.checks) obj.checks = {};
          return obj;
        }
      } catch (e) {}
      return {
        startDate: D.defaultStartIso || "2026-11-21",
        completedDays: [],
        examScores: {},
        moduleScores: {},
        qHistory: {},
        wrongQueue: [],
        vfHistory: {},
        checks: {},
      };
    }

    function recordQuestionResult(examId, qNum, isCorrect, isRevanche = false) {
      const key = `${examId}_${qNum}`;
      pState.qHistory = pState.qHistory || {};
      pState.wrongQueue = pState.wrongQueue || [];
      pState.qHistory[key] = !!isCorrect;
      if (!isCorrect) {
        if (!pState.wrongQueue.includes(key)) pState.wrongQueue.push(key);
      } else if (isRevanche) {
        pState.wrongQueue = pState.wrongQueue.filter((k) => k !== key);
      }
      savePlatformState();
    }

    function savePlatformState() {
      try { localStorage.setItem(STORE_CENTRAL, JSON.stringify(pState)); } catch (e) {}
      updateTopHud();
    }

    function loadCardsState() {
      try {
        const raw = localStorage.getItem(STORE_CARDS);
        if (raw) {
          const obj = JSON.parse(raw);
          if (!Array.isArray(obj.known)) obj.known = [];
          if (!Array.isArray(obj.review)) obj.review = [];
          // Sanitiza índices se o baralho mudou de tamanho entre versões
          obj.known = obj.known.filter((i) => i >= 0 && i < D.flashcards.length);
          obj.review = obj.review.filter((i) => i >= 0 && i < D.flashcards.length);
          return obj;
        }
      } catch (e) {}
      return { xp: 0, streak: 0, hearts: 5, known: [], review: [] };
    }

    function saveCardsState() {
      try { localStorage.setItem(STORE_CARDS, JSON.stringify(cState)); } catch (e) {}
      updateTopHud();
    }

    function playTone(freq, dur, type = "sine", delay = 0) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        const t = audioCtx.currentTime + delay;
        g.gain.setValueAtTime(0.11, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + dur);
      } catch (e) {}
    }
    function sfxOk() { playTone(523.25, 0.11, "triangle", 0); playTone(659.25, 0.17, "triangle", 0.09); }
    function sfxBad() { playTone(190, 0.14, "sawtooth", 0); playTone(145, 0.2, "sawtooth", 0.11); }
    function toggleSound() {
      soundOn = !soundOn;
      const b = document.getElementById("soundBtn");
      if (b) b.textContent = soundOn ? "🔊 Som" : "🔇 Mudo";
    }

    function parseIso(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 0, 0, 0, 0); }
    function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
    function toIso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function fmtBr(d) { return `${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()]}, ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`; }
    function getToday() {
      if (simDateOverride) return parseIso(simDateOverride);
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0, 0);
    }
    function getChapterDate(dayNum) {
      if (REAL_DAY_ISOS[dayNum]) return parseIso(REAL_DAY_ISOS[dayNum]);
      const startDate = parseIso(pState.startDate || D.defaultStartIso || "2026-11-21");
      return addDays(startDate, dayNum - 1);
    }

    function getScheduleStatus() {
      const today = getToday();
      const examDate = parseIso(D.examDateIso || "2026-12-04");
      const phase2Date = parseIso(D.phase2DateIso || "2026-12-08");
      const startDate = getChapterDate(1);
      const diffPhase1 = Math.round((examDate - today) / 86400000);
      const diffPhase2 = Math.round((phase2Date - today) / 86400000);
      const phase1Chapters = D.chapters.filter((c) => c.phase === 1);
      const phase2Chapters = D.chapters.filter((c) => c.phase === 2);
      const pendingP1 = phase1Chapters.filter((c) => !pState.completedDays.includes(c.day));
      const pendingAll = D.chapters.filter((c) => !pState.completedDays.includes(c.day));
      const overdue = D.chapters.filter((c) => getChapterDate(c.day) < today && !pState.completedDays.includes(c.day));
      const nextChapter = (diffPhase1 >= 0 ? pendingP1[0] : pendingAll[0]) || pendingAll[0] || D.chapters[D.chapters.length - 1];
      return { today, examDate, phase2Date, startDate, diffPhase1, diffPhase2, phase1Chapters, phase2Chapters, pendingP1, pendingAll, overdue, nextChapter };
    }

    function updateTopHud() {
      const st = getScheduleStatus();
      const cdEl = document.getElementById("topCountdown");
      if (cdEl) {
        if (st.diffPhase1 > 0) cdEl.textContent = `⏳ 04/12: ${st.diffPhase1}d`;
        else if (st.diffPhase1 === 0) cdEl.textContent = "🎯 PROVA HOJE (04/12)";
        else if (st.diffPhase2 > 0) cdEl.textContent = `🛠️ 08/12: ${st.diffPhase2}d`;
        else if (st.diffPhase2 === 0) cdEl.textContent = "🛠️ 2ª FASE HOJE!";
        else cdEl.textContent = "✅ Concluído";
      }
      const chEl = document.getElementById("topChapters");
      if (chEl) chEl.textContent = `🗺️ ${pState.completedDays.length}/${D.chapters.length} dias`;
      const caEl = document.getElementById("topCards");
      if (caEl) caEl.textContent = `🃏 ${cState.known.length}/${D.flashcards.length}`;
      const xpEl = document.getElementById("topXp");
      if (xpEl) xpEl.textContent = `⭐ ${cState.xp} XP • 🔥 ${cState.streak}`;
    }

    const NAV_ORDER = ["home", "story", "sim", "phase2", "apostila", "cards", "labs"];
    function syncNavHighlights() {
      document.querySelectorAll("#mainNav .nav-btn").forEach((b, i) => b.classList.toggle("active", NAV_ORDER[i] === activeTab));
      document.querySelectorAll("#mobileNav .mb-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === activeTab));
    }

    function goTab(tab) {
      activeTab = tab;
      if (tab !== "story") activeChapter = null;
      if (tab !== "sim") revancheMode = false;
      syncNavHighlights();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openRevanche() {
      activeTab = "sim";
      if (simTimerId) clearInterval(simTimerId);
      simSession = null;
      revancheMode = true;
      revancheAnswers = {};
      syncNavHighlights();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openChapter(day, step = 1) {
      activeTab = "story";
      if (activeChapter !== day) {
        chapterAnswers = {};
        cardIdx = 0;
        isFlipped = false;
        clearCardMc();
      }
      activeChapter = day;
      chapterStep = step;
      syncNavHighlights();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startExamInSim(examId, mode = "instant") {
      activeTab = "sim";
      revancheMode = false;
      lastReportMsg = "";
      syncNavHighlights();
      const ex = D.exams[examId];
      if (!ex) return;
      if (simTimerId) clearInterval(simTimerId);
      simSession = { examId, mode, curIdx: 0, answers: {}, submitted: false, secLeft: ex.minutes * 60 };
      simTimerId = setInterval(() => {
        if (!simSession || simSession.submitted) return;
        simSession.secLeft = Math.max(0, simSession.secLeft - 1);
        const tel = document.getElementById("simTimerDisplay");
        if (tel) tel.textContent = "⏱️ " + fmtTimer(simSession.secLeft);
      }, 1000);
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function fmtTimer(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }

    // ==================== SYNC PC ↔ CELULAR ====================
    let showSyncPanel = false;
    let syncMsg = "";
    function encodeSyncPayload() {
      const jsonStr = JSON.stringify({ p: pState, c: cState });
      const utf8Bytes = new TextEncoder().encode(jsonStr);
      let bin = "";
      utf8Bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin);
    }
    function decodeSyncPayload(code) {
      const bin = atob(String(code || "").trim());
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const jsonStr = new TextDecoder().decode(bytes);
      const parsed = JSON.parse(jsonStr);
      if (!parsed || typeof parsed.p !== "object" || typeof parsed.c !== "object") throw new Error("Código inválido");
      return parsed;
    }
    function toggleSyncPanel() {
      showSyncPanel = !showSyncPanel;
      syncMsg = "";
      renderSyncHost();
      if (showSyncPanel) exportSyncCode(true);
    }
    function exportSyncCode(silent = false) {
      const code = encodeSyncPayload();
      const box = document.getElementById("syncCodeBox");
      if (box) box.value = code;
      if (!silent && typeof navigator !== "undefined" && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(code).catch(() => {});
      }
      syncMsg = "✅ Código copiado! Envie no WhatsApp e cole no outro aparelho.";
      const el = document.getElementById("syncStatusMsg");
      if (el) { el.textContent = syncMsg; el.style.color = "var(--green)"; }
      return code;
    }
    function importSyncCode(rawOverride) {
      const box = document.getElementById("syncCodeBox");
      const raw = rawOverride !== undefined ? rawOverride : (box ? box.value : "");
      try {
        const data = decodeSyncPayload(raw);
        pState = {
          startDate: D.defaultStartIso || "2026-11-21",
          completedDays: [], examScores: {}, moduleScores: {}, qHistory: {}, wrongQueue: [], vfHistory: {}, checks: {},
          ...data.p,
        };
        cState = { xp: 0, streak: 0, hearts: 5, known: [], review: [], ...data.c };
        cState.known = (cState.known || []).filter((i) => i >= 0 && i < D.flashcards.length);
        cState.review = (cState.review || []).filter((i) => i >= 0 && i < D.flashcards.length);
        savePlatformState();
        saveCardsState();
        syncMsg = "🎉 Progresso sincronizado com sucesso!";
        renderMain();
      } catch (e) {
        syncMsg = "❌ Código inválido ou incompleto. Copie o texto inteiro sem cortar.";
        const el = document.getElementById("syncStatusMsg");
        if (el) { el.textContent = syncMsg; el.style.color = "var(--red)"; }
      }
    }
    function renderSyncHost() {
      const host = document.getElementById("syncModalHost");
      if (!host) return;
      if (!showSyncPanel) { host.innerHTML = ""; return; }
      const ok = syncMsg.startsWith("🎉") || syncMsg.startsWith("✅");
      host.innerHTML = `
        <section class="panel" style="background:var(--purple-soft); border-color:var(--purple); margin-top:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
            <h3 style="margin:0;">📲 Sincronizar Progresso PC ↔ Celular (Via WhatsApp)</h3>
            <button class="btn sm outline" onclick="toggleSyncPanel()">✕ Fechar</button>
          </div>
          <p style="margin:0 0 10px 0; font-size:13.5px; color:var(--muted);">Clique em <strong>Gerar &amp; Copiar</strong>, mande no WhatsApp e cole abaixo no outro aparelho clicando em <strong>Carregar Código</strong>.</p>
          <textarea id="syncCodeBox" rows="3" placeholder="Cole aqui o código de sincronização..." style="width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font-family:monospace; font-size:12px; background:var(--surface); color:var(--text);">${encodeSyncPayload()}</textarea>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center;">
            <button class="btn sm purple" onclick="exportSyncCode(false)">📋 Gerar &amp; Copiar Meu Código</button>
            <button class="btn sm green" onclick="importSyncCode()">📥 Carregar Código Colado</button>
            <span id="syncStatusMsg" style="font-size:13px; font-weight:700; color:${ok ? "var(--green)" : "var(--red)"};">${escapeHtml(syncMsg)}</span>
          </div>
        </section>
      `;
    }

    function renderMain() {
      updateTopHud();
      renderSyncHost();
      const root = document.getElementById("appRoot");
      if (activeTab === "home") renderHome(root);
      else if (activeTab === "story") renderStory(root);
      else if (activeTab === "sim") renderSim(root);
      else if (activeTab === "phase2") renderPhase2(root);
      else if (activeTab === "apostila") renderApostila(root);
      else if (activeTab === "cards") renderCardsArea(root);
      else if (activeTab === "labs") renderLabsArea(root);
    }

    // ==================== RADAR DE PONTOS FRACOS ====================
    function getAreaStats() {
      const areas = D.areas || [];
      const qAreaMap = {};
      Object.entries(D.exams || {}).forEach(([exId, ex]) => {
        (ex.questions || []).forEach((q) => { qAreaMap[`${exId}_${q.num}`] = q.area; });
      });
      const vfAreaMap = {};
      (D.vfStatements || []).forEach((v) => { vfAreaMap[String(v.id)] = v.area; });

      const map = {};
      areas.forEach((a) => { map[a.id] = { ...a, total: 0, hits: 0 }; });

      Object.entries(pState.qHistory || {}).forEach(([key, ok]) => {
        const aId = qAreaMap[key];
        if (aId && map[aId]) { map[aId].total += 1; if (ok) map[aId].hits += 1; }
      });
      Object.entries(pState.vfHistory || {}).forEach(([vid, ok]) => {
        const aId = vfAreaMap[String(vid)];
        if (aId && map[aId]) { map[aId].total += 1; if (ok) map[aId].hits += 1; }
      });
      return areas.map((a) => {
        const s = map[a.id];
        const pct = s.total > 0 ? Math.round((s.hits / s.total) * 100) : null;
        return { ...s, pct };
      });
    }

    function buildRadarHtml() {
      const rows = getAreaStats();
      const tested = rows.filter((r) => r.total > 0);
      let weakest = null;
      tested.forEach((r) => {
        if (!weakest || r.pct < weakest.pct || (r.pct === weakest.pct && r.total > weakest.total)) weakest = r;
      });
      const wrongCnt = (pState.wrongQueue || []).length;
      const vfCnt = (D.vfStatements || []).length;

      const barsHtml = rows.map((r) => {
        let color = "#94a3b8", tagCls = "", statusTxt = "⚪ Sem dados ainda";
        if (r.total > 0) {
          if (r.pct >= 75) { color = "var(--green)"; tagCls = "done"; statusTxt = `🟢 Forte (${r.hits}/${r.total} • ${r.pct}%)`; }
          else if (r.pct >= 50) { color = "var(--amber)"; tagCls = "amber"; statusTxt = `🟡 Atenção (${r.hits}/${r.total} • ${r.pct}%)`; }
          else { color = "var(--red)"; tagCls = "late"; statusTxt = `🔴 Reforçar (${r.hits}/${r.total} • ${r.pct}%)`; }
        }
        const shortTxt = r.total > 0 ? `${r.hits}/${r.total}` : "—";
        return `<div title="${escapeHtml(r.title)} — ${escapeHtml(statusTxt)}" style="padding:8px 9px; border:1px solid var(--border-soft); border-radius:10px; background:var(--surface-alt); ${r.tech ? "" : ""}">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:5px; font-size:12.5px;">
            <strong>${escapeHtml(r.short || r.title)}</strong>
            <span style="color:var(--muted); font-weight:700;">${shortTxt}</span>
          </div>
          <div class="track" style="height:7px;"><div class="fill" style="width:${r.pct ?? 0}%; background:${color};"></div></div>
        </div>`;
      }).join("");

      const diagHtml = weakest
        ? `<div class="callout ${weakest.pct < 50 ? "callout-caution" : (weakest.pct < 75 ? "callout-warning" : "callout-note")}" style="margin:10px 0 12px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div><strong>${weakest.pct < 75 ? "🎯 Prioridade de Reforço:" : "🏆 Ponto a Manter:"}</strong> <strong>${weakest.title}</strong> (<strong>${weakest.pct}%</strong> em ${weakest.total} itens).</div>
            <button class="btn sm ${weakest.pct < 50 ? "red" : "amber"}" onclick="openChapter(${weakest.recommendedDay}, 1)">Ir ao Dia ${weakest.recommendedDay} ▶</button>
          </div>`

    // ==================== 1. HOME & COACH ====================
    function renderHome(root) {

        coachTitle = "🎯 1º Passo Recomendado: Diagnóstico Real Taboão (05/12/2025 — 40Q)";
        coachMsg = "Faça a prova real mais recente da Etec de Taboão em <strong>Modo Prova Real</strong> (sem consultar), clique em <strong>📋 Copiar Diagnóstico p/ WhatsApp</strong> no final e descubra exatamente onde subir +10 pontos até 04/12! Lembre: o corte eliminatório é <strong>20/40 (50%)</strong>.";

      const simVal = simDateOverride || toIso(st.today);
      const primaryExamsHtml = primaryIds.map((id) => {
        const ex = D.exams[id];
        if (!ex) return "";
        const sc = pState.examScores[ex.id];
        let badgeHtml = `<span class="tag-pill">Não feita</span>`;
        if (sc) {
          if (sc.hits >= (ex.target || 24)) badgeHtml = `<span class="tag-pill done">🏆 ${sc.hits}/${sc.total} (${sc.pct}%)</span>`;
          else if (sc.hits >= (ex.cutoff || 20)) badgeHtml = `<span class="tag-pill amber">✅ ${sc.hits}/${sc.total} (${sc.pct}%)</span>`;
          else badgeHtml = `<span class="tag-pill late">🎯 ${sc.hits}/${sc.total} (${sc.pct}%)</span>`;
        }
        return `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:11px 12px; border:1px solid ${ex.recommended ? "var(--amber)" : "var(--border-soft)"}; border-radius:12px; background:${ex.recommended ? "var(--amber-soft)" : "var(--surface-alt)"};">
          <div>
            <strong>${escapeHtml(ex.title)}</strong><br>
            <small style="color:var(--muted)">${ex.badge}${ex.questions.length === 40 ? " • Corte: 20/40 | Meta: 24+/40" : ""}</small>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${badgeHtml}
            <button class="btn sm ${ex.recommended ? "amber" : ""}" onclick="startExamInSim('${ex.id}', '${ex.recommended ? "real" : "instant"}')">▶ Abrir</button>
          </div>
        </div>`;
      }).join("");

      const heroBtns = !diagDone
        ? `<button class="btn lg amber" onclick="startExamInSim('taboao2026', 'real')">⭐ Fazer o diagnóstico (prova de 05/12/2025)</button>
           <button class="btn lg green" onclick="openChapter(${ch.day}, 1)">▶ Trilha Dia ${ch.day}</button>
           <button class="btn lg purple" onclick="goTab('phase2')">🛠️ Ver 2ª Fase (08/12)</button>`
        : `<button class="btn lg green" onclick="openChapter(${ch.day}, 1)">▶ Continuar Dia ${ch.day} (${ch.dateLabel})</button>
           <button class="btn lg purple" onclick="goTab('phase2')">🛠️ Treinar 2ª Fase (08/12)</button>
           <button class="btn lg amber" onclick="startExamInSim('repetidas', 'instant')">🔁 Treino das Repetidas</button>`;

      root.innerHTML = `
        <section class="hero">
          <div>
            <span style="display:inline-block; background:rgba(255,255,255,0.18); padding:4px 11px; border-radius:999px; font-size:12px; font-weight:800;">ETEC DE TABOÃO DA SERRA • 2ª SÉRIE M-TEC-PI (DS)</span>
            <h1 style="margin:10px 0 6px 0; font-size:24px; line-height:1.25;">${!diagDone ? "Comece pelo diagnóstico: a prova real de Taboão de dezembro/2025" : `Próxima Missão: Dia ${ch.day} — ${escapeHtml(ch.title)}`}</h1>
            <p style="margin:0 0 15px 0; opacity:0.93; font-size:14px;">${!diagDone ? "Tudo aqui foi montado a partir das provas reais da Etec de Taboão de 2021 a 2025: 16 dias de trilha, as provas com gabarito conferido, o treino das questões que se repetem e o laboratório da 2ª fase." : escapeHtml(ch.storyIntro)}</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">${heroBtns}</div>
          </div>
          <div class="countdown-box">
            <div class="cd-row">
              <div><div style="font-size:11px; opacity:0.85; font-weight:700;">1ª FASE • PROVA ESCRITA (40Q)</div><div style="font-size:12.5px;">Sex 04/12 • Corte: <strong>20/40 (50%)</strong></div></div>
              <div class="countdown-num">${st.diffPhase1 > 0 ? `${st.diffPhase1}d` : (st.diffPhase1 === 0 ? "HOJE" : "OK")}</div>
            </div>
            <div class="cd-row">
              <div><div style="font-size:11px; opacity:0.85; font-weight:700;">2ª FASE • LAB PRÁTICO + ENTREVISTA</div><div style="font-size:12.5px;">Ter 08/12 • Prática no computador + entrevista</div></div>
              <div class="countdown-num">${st.diffPhase2 > 0 ? `${st.diffPhase2}d` : (st.diffPhase2 === 0 ? "HOJE" : "OK")}</div>
            </div>
            <div style="font-size:12px; opacity:0.9; text-align:center;">Trilha: <strong>${doneCount}/${D.chapters.length}</strong> dias • Cards: <strong>${cState.known.length}/${D.flashcards.length}</strong> • ⭐ <strong>${cState.xp} XP</strong></div>
          </div>
        </section>

        <section class="coach ${coachCls}">
          <div class="coach-head">
            <h2 style="margin:0; font-size:17px;">${coachTitle}</h2>
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; background:rgba(255,255,255,0.65); color:#0f172a; padding:5px 9px; border-radius:8px;">
              <label><strong>Simular data:</strong> <input type="date" value="${simVal}" min="2026-11-20" max="2026-12-09" onchange="simDateOverride=this.value||null; renderMain();" style="border:1px solid #94a3b8; border-radius:5px; padding:2px 4px;"></label>
              ${simDateOverride ? `<button class="btn sm dark" onclick="simDateOverride=null; renderMain();">Hoje Real</button>` : ""}
            </div>
          </div>
          <div style="font-size:14px;">${coachMsg}</div>
        </section>

        <section class="kpi-grid">
          <div class="kpi"><div class="kpi-label">1ª Fase (Escrita 04/12)</div><div class="kpi-val">${doneP1} / 13 dias</div><div class="track"><div class="fill" style="width:${Math.round(doneP1/13*100)}%"></div></div></div>
          <div class="kpi"><div class="kpi-label">2ª Fase (Lab 08/12)</div><div class="kpi-val">${doneCount - doneP1} / 3 dias</div><div class="track"><div class="fill" style="width:${Math.round((doneCount - doneP1)/3*100)}%; background:var(--purple)"></div></div></div>
          <div class="kpi"><div class="kpi-label">Flashcards Taboão</div><div class="kpi-val">${cState.known.length} / ${D.flashcards.length}</div><div class="track"><div class="fill" style="width:${Math.round(cState.known.length/D.flashcards.length*100)}%; background:var(--primary)"></div></div></div>
          <div class="kpi"><div class="kpi-label">Provas principais feitas</div><div class="kpi-val">${primaryIds.filter((id) => !!pState.examScores[id]).length} / ${primaryIds.length}</div><small style="color:var(--muted)">+ provas antigas de Taboão na aba Provas</small></div>
        </section>

        ${buildRadarHtml()}

        <section class="panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <h2 style="margin:0; font-size:18px;">📝 Provas reais de Taboão e treino das repetidas</h2>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn sm outline" onclick="goTab('apostila')">📖 Apostila &amp; Cola</button>
              <button class="btn sm outline" onclick="goTab('labs')">🧪 Micro-Labs</button>
              <button class="btn sm outline" onclick="if(confirm('Zerar todo o progresso salvo neste aparelho?')){pState.completedDays=[];pState.examScores={};pState.moduleScores={};pState.qHistory={};pState.wrongQueue=[];pState.vfHistory={};pState.checks={};revancheAnswers={};vfSessionPicked={};savePlatformState();renderMain();}">↺ Zerar</button>

          <div style="display:grid; gap:8px;">${primaryExamsHtml}</div>

    // ==================== 2. TRILHA 16 DIAS (FASE 1 + FASE 2) ====================
    function renderStory(root) {
      if (activeChapter !== null) {
        renderChapterFocus(root, activeChapter);
        return;
      }
      const st = getScheduleStatus();
      const buildCard = (ch) => {
        const cDate = getChapterDate(ch.day);
        const done = pState.completedDays.includes(ch.day);
        const isToday = toIso(cDate) === toIso(st.today);
        const isLate = !done && cDate < st.today;
        const mSc = (pState.moduleScores || {})[ch.day];
        let cls = "chap-card", pillCls = "", pillTxt = "⏳ Agendado";
        if (done) { cls += " done"; pillCls = "done"; pillTxt = "✅ Concluído"; }
        else if (isToday) { cls += " today"; pillCls = "today"; pillTxt = "🎯 Hoje"; }
        else if (isLate) { cls += " late"; pillCls = "late"; pillTxt = "⚠️ Pendente"; }

        const scoreBadge = mSc
          ? `<span class="tag-pill ${mSc.pct >= 70 ? "done" : "late"}" style="margin-left:4px;">${mSc.hits}/${mSc.total} (${mSc.pct}%)</span>`
          : "";

        return `<div class="${cls}">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:12px; font-weight:800; flex-wrap:wrap;">
              <span>Dia ${String(ch.day).padStart(2,"0")} • ${ch.dateLabel || fmtBr(cDate)}</span>
              <div><span class="tag-pill ${pillCls}">${pillTxt}</span>${scoreBadge}</div>
            </div>
            <h3 style="margin:7px 0 5px 0; font-size:15.5px;">${escapeHtml(ch.title)}</h3>
            <p style="margin:0; font-size:13px; color:var(--muted);">${escapeHtml(ch.storyIntro)}</p>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-soft); padding-top:9px; gap:8px;">
            <small style="color:var(--muted);"><strong>${ch.weight}</strong> • Quiz ${ch.challengeRefs.length}Q</small>
            <button class="btn sm ${done ? "dark" : "green"}" onclick="openChapter(${ch.day}, 1)">${done ? "Rever" : "Iniciar ▶"}</button>
          </div>
        </div>`;
      };

      const p1Cards = D.chapters.filter((c) => c.phase === 1).map(buildCard).join("");
      const p2Cards = D.chapters.filter((c) => c.phase === 2).map(buildCard).join("");

      root.innerHTML = `
        <section class="panel">
          <h2 style="margin-top:0;">🗺️ Fase 1 — Rumo à Prova Escrita (Dias 1 a 13 • 21/11 → 03/12)</h2>
          <p style="color:var(--muted); font-size:14px; margin-top:0;">Montado a partir das provas reais de Taboão (2021–2025). Cada dia tem <strong>1. Aula (com caixas "Sua vez") &rarr; 2. Prática &rarr; 3. Quiz com questões reais</strong>.</p>
          <div class="story-map">${p1Cards}</div>
        </section>

        <section class="panel" style="border-color:var(--purple); background:var(--purple-soft);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
            <h2 style="margin:0;">🛠️ Fase 2 — Sprint Laboratório Prático &amp; Entrevista (Dias 14 a 16 • 05/12 → 07/12)</h2>
            <button class="btn sm purple" onclick="goTab('phase2')">Abrir Lab 2ª Fase Direto ▶</button>
          </div>
          <p style="color:var(--muted); font-size:14px; margin-top:0;"><strong>Dia 04/12 (sexta)</strong> é a Prova Escrita! Do sábado <strong>05/12</strong> à segunda <strong>07/12</strong>, você treina mão na massa para arrasar no laboratório de <strong>08/12 (13h00–15h30)</strong>!</p>
          <div class="story-map">${p2Cards}</div>
        </section>
      `;
    }

    let chapterAnswers = {};
    let openVideoClips = {};
    let miniPlayerNote = {};
    function fmtMmSs(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
    function fmtClipDur(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return m > 0 ? (s > 0 ? `${m}m${String(s).padStart(2,"0")}s` : `${m} min`) : `${s}s`;
    }
    function openClipPlayer(videoId, startSec, endSec, key) {
      const isHttp = !!(window.location && window.location.protocol && window.location.protocol.startsWith("http"));
      if (isHttp) {
        openVideoClips[key] = !openVideoClips[key];
        renderMain();
      } else {
        const watchUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startSec}s`;
        window.open(watchUrl, "etec_mini_player", "width=880,height=540,menubar=no,toolbar=no,location=yes,resizable=yes,scrollbars=yes");
        miniPlayerNote[key] = true;
        renderMain();
      }
    }
    function renderVideoClipsHtml(ch) {
      const clips = ch.videoClips || [];
      if (!clips.length) return "";
      const isHttp = !!(window.location && window.location.protocol && window.location.protocol.startsWith("http"));
      const cards = clips.map((v, idx) => {
        const key = `${ch.day}_${idx}`;
        const isOpen = !!openVideoClips[key];
        const hasMiniNote = !!miniPlayerNote[key];
        const sStr = fmtMmSs(v.startSec), eStr = fmtMmSs(v.endSec), durStr = fmtClipDur(v.endSec - v.startSec);
        const embedUrl = `https://www.youtube.com/embed/${v.videoId}?start=${v.startSec}&end=${v.endSec}&autoplay=1&rel=0`;
        const watchUrl = `https://www.youtube.com/watch?v=${v.videoId}&t=${v.startSec}s`;
        const iframeHtml = (isHttp && isOpen)
          ? `<div style="margin-top:10px;"><iframe src="${embedUrl}" title="${escapeHtml(v.title)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%; max-width:680px; height:360px; border:0; border-radius:10px; background:#0f172a;"></iframe><div style="font-size:12px; color:var(--muted); margin-top:4px;">Player embutido ativo: começa em <strong>${sStr}</strong> e para em <strong>${eStr}</strong>.</div></div>`
          : "";
        const miniNoteHtml = (!isHttp && hasMiniNote)
          ? `<div class="callout callout-note" style="margin-top:10px;">⏱️ <strong>Mini-Player aberto no minuto ${sStr}!</strong> Assista até <strong>${eStr}</strong> (${durStr}).</div>`
          : "";
        const mainBtnLabel = (isHttp && isOpen) ? "Ocultar Player" : `Assistir Trecho (${sStr} → ${eStr})`;
        return `<div style="border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--surface);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:6px;">
            <div>
              <strong style="font-size:14.5px;">${escapeHtml(v.title)}</strong>
              <div style="font-size:12.5px; color:var(--muted);">${escapeHtml(v.channel)}</div>
            </div>
            <span class="tag-pill today">✂️ ${sStr}–${eStr} (${durStr})</span>
          </div>
          <p style="margin:8px 0; font-size:13px; color:var(--muted);">${escapeHtml(v.tip)}</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <button class="btn sm green" onclick="openClipPlayer('${v.videoId}', ${v.startSec}, ${v.endSec}, '${key}')">📺 ${mainBtnLabel}</button>
            <a class="btn sm outline" href="${watchUrl}" target="_blank" rel="noopener">▶️ Abrir no YouTube</a>
          </div>
          ${miniNoteHtml}
          ${iframeHtml}
        </div>`;
      }).join("");
      return `<div class="panel" style="background:var(--primary-soft); border-color:var(--primary); padding:14px; margin-bottom:16px;">
        <h3 style="margin:0 0 8px 0; font-size:15.5px;">🎬 Vídeos Curtos da Lição (Trechos Direto ao Ponto)</h3>
        <div style="display:grid; gap:10px;">${cards}</div>
      </div>`;
    }

    function getChapterQuizStats(ch) {
      const total = ch.challengeRefs.length;
      const answered = Object.keys(chapterAnswers).length;
      let hits = 0;
      ch.challengeRefs.forEach((ref, idx) => {
        const q = D.exams[ref.examId].questions.find((x) => x.num === ref.qNum);
        if (chapterAnswers[idx] !== undefined && chapterAnswers[idx] === q.answer) hits += 1;
      });
      const pct = total > 0 ? Math.round((hits / total) * 100) : 0;
      return { hits, total, answered, pct, allDone: answered === total };
    }

    function renderChapterFocus(root, dayNum) {
      const ch = D.chapters.find((c) => c.day === dayNum);
      const isDone = pState.completedDays.includes(dayNum);
      const savedSc = (pState.moduleScores || {})[dayNum];
      const totalDays = D.chapters.length;

      root.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <button class="btn sm outline" onclick="activeChapter=null; renderMain();">◀ Voltar à Trilha (${totalDays} Dias)</button>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            ${savedSc ? `<span class="tag-pill ${savedSc.pct >= 70 ? "done" : "late"}">Melhor Nota: ${savedSc.hits}/${savedSc.total} (${savedSc.pct}%)</span>` : ""}
            <span class="tag-pill ${isDone ? "done" : "today"}">Dia ${ch.day}/${totalDays} • ${ch.dateLabel || ""} ${isDone ? "• ✅ Concluído" : ""}</span>
          </div>
        </div>

        <section class="panel">
          <h2 style="margin:0 0 6px 0;">Dia ${ch.day} (${ch.dateLabel || ""}): ${escapeHtml(ch.title)}</h2>
          <p style="margin:0 0 14px 0; color:var(--muted); font-size:14px;">${escapeHtml(ch.storyIntro)}</p>

          <div class="stepper">
            <button class="step-pill ${chapterStep === 1 ? "active" : (chapterStep > 1 ? "done" : "")}" onclick="chapterStep=1; renderMain();">1. 📖 Lição</button>
            <button class="step-pill ${chapterStep === 2 ? "active" : (chapterStep > 2 ? "done" : "")}" onclick="chapterStep=2; renderMain();">2. 🧪 Prática</button>
            <button class="step-pill ${chapterStep === 3 ? "active" : ""}" onclick="chapterStep=3; renderMain();">3. 📝 Quiz (${ch.challengeRefs.length}Q)</button>
          </div>

          <div id="chapterStepBody"></div>
        </section>
      `;

      const body = document.getElementById("chapterStepBody");
      if (chapterStep === 1) {
        const task = ch.examTask;
        const day1DiagCta = task && D.exams[task.examId]
          ? `<div class="callout callout-warning" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <div><strong>⭐ Missão principal de hoje:</strong> ${escapeHtml(task.label)}. Modo prova real: 4 horas, sem consulta.</div>
              <button class="btn sm amber" onclick="startExamInSim('${task.examId}', 'real')">▶ Abrir a prova</button>
            </div>`
          : "";
        body.innerHTML = `
          ${day1DiagCta}
          ${renderVideoClipsHtml(ch)}
          <div class="lesson-body">${ch.lessonHtml}</div>
          <div style="display:flex; justify-content:flex-end; margin-top:18px; border-top:1px solid var(--border-soft); padding-top:14px;">
            <button class="btn lg green" onclick="chapterStep=2; renderMain(); window.scrollTo({top:0,behavior:'smooth'});">Avançar para Passo 2: Prática ▶</button>

    function saveModuleScoreIfComplete(ch) {
      const stats = getChapterQuizStats(ch);
      if (!stats.allDone) return;
      pState.moduleScores = pState.moduleScores || {};
      const prev = pState.moduleScores[ch.day];
      if (!prev || stats.pct >= prev.pct) {
        pState.moduleScores[ch.day] = { hits: stats.hits, total: stats.total, pct: stats.pct };
      }
      savePlatformState();
    }

    function answerChapterQ(qIdx, choiceIdx, rightIdx, dayNum) {
      if (chapterAnswers[qIdx] !== undefined) return;
      chapterAnswers[qIdx] = choiceIdx;
      const isOk = choiceIdx === rightIdx;
      if (isOk) { cState.xp += 15; cState.streak += 1; sfxOk(); }
      else { cState.streak = 0; sfxBad(); }
      const ch = D.chapters.find((c) => c.day === dayNum);
      if (ch) {
        const ref = ch.challengeRefs[qIdx];
        if (ref) recordQuestionResult(ref.examId, ref.qNum, isOk, false);
        saveModuleScoreIfComplete(ch);
      }
      saveCardsState();
      renderMain();
    }

    function completeChapter(dayNum, goNext) {
      const ch = D.chapters.find((c) => c.day === dayNum);
      if (ch) saveModuleScoreIfComplete(ch);
      if (!pState.completedDays.includes(dayNum)) {
        pState.completedDays.push(dayNum);
        cState.xp += 50;
        sfxOk();
        saveCardsState();
      }
      savePlatformState();
      if (goNext) openChapter(dayNum + 1, 1);
      else goTab("home");
    }

    // ==================== 3. SIMULADOR DE PROVAS & DIAGNÓSTICO WHATSAPP ====================
    function buildExamReportData(ex, answers) {
      const qs = ex.questions;
      const total = qs.length;
      const hits = qs.filter((q) => answers[q.num] === q.answer).length;
      const pct = Math.round((hits / total) * 100);
      const cutoff = ex.cutoff || Math.ceil(total * 0.5);
      const target = ex.target || Math.ceil(total * 0.625);

      const techQs = qs.filter((q) => q.isTech);
      const baseQs = qs.filter((q) => !q.isTech);
      const techHits = techQs.filter((q) => answers[q.num] === q.answer).length;
      const baseHits = baseQs.filter((q) => answers[q.num] === q.answer).length;

      const byArea = (D.areas || []).map((a) => {
        const aqs = qs.filter((q) => q.area === a.id);
        const ah = aqs.filter((q) => answers[q.num] === q.answer).length;
        return { id: a.id, title: a.title, hits: ah, total: aqs.length, pct: aqs.length ? Math.round((ah / aqs.length) * 100) : null };
      }).filter((x) => x.total > 0);

      const status = hits >= target
        ? "🏆 ACIMA DA META SEGURA!"
        : (hits >= cutoff ? "✅ ACIMA DO CORTE (≥ 50%) — agora é subir para a meta de 24+" : "🎯 ABAIXO DO CORTE POR ENQUANTO — ótimo diagnóstico para focar certo!");

      const lines = [
        `📊 *DIAGNÓSTICO ETEC TABOÃO DA SERRA*`,
        `📝 Prova: ${escapeHtml(ex.title)}`,
        `🎯 Placar: *${hits}/${total} (${pct}%)* | Corte: ${cutoff}/${total} | Meta: ${target}+/${total}`,
        `📌 Status: ${status}`,
      ];
      if (techQs.length > 0 && baseQs.length > 0) {
        lines.push(`💻 Técnico: *${techHits}/${techQs.length}* (${Math.round(techHits/techQs.length*100)}%) | 📚 Base Comum: *${baseHits}/${baseQs.length}* (${Math.round(baseHits/baseQs.length*100)}%)`);
      }
      lines.push(`\n*Por matéria:*`);
      byArea.forEach((a) => {
        const emo = a.pct >= 75 ? "🟢" : (a.pct >= 50 ? "🟡" : "🔴");
        lines.push(`${emo} ${a.title}: ${a.hits}/${a.total} (${a.pct}%)`);
      });
      const wrongNums = qs.filter((q) => answers[q.num] !== q.answer).map((q) => `Q${q.num}`);
      if (wrongNums.length > 0) lines.push(`\n❌ Errei (${wrongNums.length}): ${wrongNums.join(", ")}`);
      return { hits, total, pct, cutoff, target, techHits, techTotal: techQs.length, baseHits, baseTotal: baseQs.length, byArea, status, whatsappText: lines.join("\n") };
    }

    function copyExamWhatsappReport() {
      if (!simSession) return;
      const ex = D.exams[simSession.examId];
      const rep = buildExamReportData(ex, simSession.answers);
      if (typeof navigator !== "undefined" && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(rep.whatsappText).catch(() => {});
      }
      lastReportMsg = "✅ Diagnóstico copiado! Agora é só colar no WhatsApp e enviar!";
      const box = document.getElementById("waReportFallback");
      if (box) { box.style.display = "block"; box.value = rep.whatsappText; }
      const st = document.getElementById("waReportStatus");
      if (st) st.textContent = lastReportMsg;
      return rep.whatsappText;
    }

              <button class="btn sm outline" onclick="if(simTimerId)clearInterval(simTimerId); simSession=null; renderMain();">✕ Trocar Prova</button>
            </div>
          </div>

          ${summaryHtml}
          <div class="sim-palette">${palette}</div>

          <div class="q-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
              <span style="font-weight:800; color:var(--primary);">Questão ${curQ.num} de ${qs.length}</span>
              <span class="tag-pill ${curQ.isTech ? "today" : ""}">${curQ.isTech ? "💻 Bloco Técnico" : "📚 Base Comum"}</span>
            </div>
            <div>${curQ.stemHtml}</div>
            <div class="opts-list">${optsHtml}</div>
            ${expHtml}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <button class="btn outline" ${simSession.curIdx === 0 ? "disabled" : ""} onclick="simSession.curIdx--; renderMain(); window.scrollTo({top:0,behavior:'smooth'});">◀ Anterior</button>
            <span style="font-size:13px; color:var(--muted);">Respondidas: ${Object.keys(simSession.answers).length} / ${qs.length}</span>
            <button class="btn" ${simSession.curIdx >= qs.length - 1 ? "disabled" : ""} onclick="simSession.curIdx++; renderMain(); window.scrollTo({top:0,behavior:'smooth'});">Próxima ▶</button>
          </div>
        </section>
      `;
    }

    function answerRevancheQ(qKey, examId, qNum, oi, rightAns) {
      if (revancheAnswers[qKey] && revancheAnswers[qKey].picked !== undefined) return;
      const isOk = oi === rightAns;
      revancheAnswers[qKey] = { picked: oi, isCorrect: isOk };
      if (isOk) { cState.xp += 20; cState.streak += 1; sfxOk(); }
      else { cState.streak = 0; sfxBad(); }
      recordQuestionResult(examId, qNum, isOk, true);
      saveCardsState();
      renderMain();
    }

    function answerSimQ(qNum, oi, rightAns) {
      if (simSession.submitted) return;
      if (simSession.mode === "instant" && simSession.answers[qNum] !== undefined) return;
      simSession.answers[qNum] = oi;
      if (simSession.mode === "instant") {
        const isOk = oi === rightAns;
        if (isOk) { cState.xp += 10; cState.streak += 1; sfxOk(); }
        else { cState.streak = 0; sfxBad(); }
        recordQuestionResult(simSession.examId, qNum, isOk, false);
        saveCardsState();
      }
      renderMain();
    }

    function submitSim() {
      const ex = D.exams[simSession.examId];
      simSession.submitted = true;
      ex.questions.forEach((q) => {
        if (simSession.mode === "real" || simSession.answers[q.num] !== undefined) {
          recordQuestionResult(ex.id, q.num, simSession.answers[q.num] === q.answer, false);
        }
      });
      const hits = ex.questions.filter((q) => simSession.answers[q.num] === q.answer).length;
      const pct = Math.round((hits / ex.questions.length) * 100);
      const prev = pState.examScores[ex.id];
      if (!prev || hits >= prev.hits) pState.examScores[ex.id] = { hits, total: ex.questions.length, pct };
      cState.xp += hits * 5;
      sfxOk();
      saveCardsState();
      savePlatformState();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ==================== 4. 2ª FASE (08/12 — LAB PRÁTICO + ENTREVISTA) ====================
    function copyP2Code(labId, slot, btnEl) {
      const lab = (D.phase2.labs || []).find((x) => x.id === labId);
      if (!lab) return;
      const text = slot === 2 ? lab.code2 : lab.code;
      if (typeof navigator !== "undefined" && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      if (btnEl) {
        const old = btnEl.textContent;
        btnEl.textContent = "✅ Copiado!";
        setTimeout(() => { btnEl.textContent = old; }, 1600);
      }
    }

    function toggleP2Check(key) {
      pState.checks = pState.checks || {};
      pState.checks[key] = !pState.checks[key];
      if (pState.checks[key]) { cState.xp += 10; sfxOk(); saveCardsState(); }
      savePlatformState();
      renderMain();
    }

    function renderPhase2(root) {
      const p2 = D.phase2;
      if (!p2) { root.innerHTML = "<div class='panel'>Conteúdo da 2ª Fase indisponível.</div>"; return; }
      const totalChecks = p2.labs.reduce((acc, l) => acc + (l.checklist || []).length, 0);
      const doneChecks = p2.labs.reduce((acc, l) => acc + (l.checklist || []).filter((_, i) => !!(pState.checks || {})[`${l.id}_${i}`]).length, 0);

      root.innerHTML = `
        <section class="panel" style="border-color:var(--purple); background:var(--purple-soft);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
              <span class="tag-pill today">🛠️ 2ª FASE ELIMINATÓRIA • ${p2.dateLabel}</span>
              <h2 style="margin:8px 0 4px 0;">Treinador Prático de Laboratório + Entrevista Individual</h2>
            </div>

        <section class="panel">
          <div id="phase2Mount"></div>
        </section>

      renderPhase2Into(document.getElementById("phase2Mount"), false);

          ${qaHtml}
        `;

      const interviewNudge = forceShowInterviewHint

        : "";

      container.innerHTML = `
        <div class="subtabs">${tabBtns}</div>
        ${interviewNudge}
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">

            <h3 style="margin:6px 0 2px 0; font-size:19px;">${escapeHtml(lab.title)}</h3>

        <div class="callout callout-note">${lab.mission}</div>

        <h4>📋 Passo a passo (como fazer no laboratório):</h4>
        <ol style="padding-left:20px; font-size:14px;">${stepsHtml}</ol>

        <details class="recall-box" style="margin-top:14px;">
          <summary>🔒 Ver uma solução (só depois de tentar e cronometrar!)</summary>
          <div class="code-head">

          ${lab.code2 ? `

    // ==================== 5. APOSTILA & COLA NA TELA ====================
    function selectApostila(id) { activeApostilaId = id; renderMain(); }
    function renderApostila(root) {
      const tabs = D.apostilaSections.map((s) => `<button class="chip ${activeApostilaId === s.id ? "active" : ""}" onclick="selectApostila('${s.id}')">${s.title}</button>`).join("");
